<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latihan ASTS Bab 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f8ff;color:#263238}.top{background:#2e7d32;color:#fff;padding:28px 16px;text-align:center}.top h1{margin:6px 0}.wrap{max-width:900px;margin:auto;padding:20px 14px}.q{background:#fff;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #0001}.q h3{margin-top:0}.opt{display:block;border:1px solid #d5dfe8;border-radius:11px;padding:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#f0f6ff}.actions{position:sticky;bottom:0;background:#ffffffee;padding:12px;border-top:1px solid #ddd;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;color:#fff}.check{background:#2e7d32}.corr{background:#455a64}.home{background:#fff;color:#263238;text-decoration:none}.result{background:#fff;border-radius:16px;padding:18px;margin:16px 0;font-weight:700}.review{display:none}.review .ok{border-left:5px solid #2e7d32;padding:10px;background:#edf8ef;margin:8px 0}.review .bad{border-left:5px solid #c62828;padding:10px;background:#fff1f1;margin:8px 0}</style></head><body><header class="top"><div>📘 Bahasa Indonesia Kelas 4</div><h1>Latihan ASTS Bab 2</h1><p>Tugasku — 30 soal interaktif</p><a class="btn home" href="bahasa-indonesia-asts-menu.html">🏠 Menu ASTS 1</a></header><main class="wrap"><div id="quiz"></div><div class="actions"><button class="btn check" onclick="check()">✅ Periksa Nilai</button><button class="btn corr" onclick="correction()">📝 Koreksi Jawaban</button></div><div id="result" class="result">Belum diperiksa. Pilih jawaban untuk semua soal, lalu tekan Periksa Nilai.</div><section id="review" class="review"></section></main><script>const data=[{"q":"Informasi dari teks dapat disampaikan kembali dengan …","o":["bahasa yang santun dan kalimat mudah dipahami","kata-kata acak","hanya satu kata","tanpa memahami teks"],"a":0,"e":"Bab 2 mengajarkan menceritakan kembali informasi dengan bahasa santun dan mudah dipahami."},{"q":"Ide pokok adalah …","o":["gagasan utama sebuah paragraf","nama penulis","gambar","nomor halaman"],"a":0,"e":"Ide pokok merupakan gagasan utama dalam paragraf."},{"q":"Kata 'genting' pada 'genting rumah' bermakna …","o":["tutup atap rumah dari tanah liat","situasi berbahaya","jadwal","alat musik"],"a":0,"e":"Pada Bab 2, genting bermakna tutup atap rumah."},{"q":"Kata 'genting' pada 'keadaan genting' bermakna …","o":["tegangan atau keadaan berbahaya","tutup atap","lembar kertas","ruang sela"],"a":0,"e":"Makna genting berubah sesuai konteks menjadi keadaan yang berbahaya."},{"q":"Homonim adalah kata yang …","o":["memiliki lebih dari satu makna tetapi bentuk dan pengucapannya sama","selalu berbeda tulisan","hanya berupa kata kerja","tidak memiliki makna"],"a":0,"e":"Bab 2 menjelaskan homonim sebagai kata yang sama bentuk/pelafalannya tetapi bermakna berbeda."},{"q":"Contoh pasangan makna kata 'bisa' adalah …","o":["dapat/mampu dan zat racun","buku dan bulan","jarak dan kali","rapat dan hak"],"a":0,"e":"Tabel homonim Bab 2 memberi dua makna tersebut untuk 'bisa'."},{"q":"Kata 'bulan' dapat berarti …","o":["satelit alami Bumi dan satuan waktu","alat menggambar dan sungai","bagian sepatu dan kepunyaan","ruang sela dan rapat"],"a":0,"e":"Tabel Bab 2 memberi dua makna 'bulan'."},{"q":"Kata 'hak' dapat berarti …","o":["bagian dari sepatu wanita dan milik/kepunyaan","sungai dan pertemuan","satuan waktu dan satelit","zat racun dan kalender"],"a":0,"e":"Tabel homonim memuat dua makna tersebut."},{"q":"Awalan me- pada kata dasar 'lihat' menjadi …","o":["melihat","menlihat","menglihat","megelihat"],"a":0,"e":"Contoh Bab 2: me- + lihat menjadi melihat."},{"q":"Awalan me- pada 'nyanyi' menjadi …","o":["menyanyi","menyanyii","mengnyanyi","menyanyi-kan"],"a":0,"e":"Contoh Bab 2: me- + nyanyi menjadi menyanyi."},{"q":"Awalan me- pada 'tabung' menjadi …","o":["menabung","metabung","mengtabung","menyabung"],"a":0,"e":"Contoh Bab 2: me- + tabung menjadi menabung."},{"q":"Awalan me- pada 'cari' menjadi …","o":["mencari","mengcari","mecari","menyari"],"a":0,"e":"Contoh Bab 2: me- + cari menjadi mencari."},{"q":"Awalan me- pada 'sapu' menjadi …","o":["menyapu","mensapu","mengsapu","mesapu"],"a":0,"e":"Contoh Bab 2: me- + sapu menjadi menyapu."},{"q":"Awalan me- pada 'pompa' menjadi …","o":["memompa","menpompa","mengpompa","mempompa"],"a":0,"e":"Contoh Bab 2: me- + pompa menjadi memompa."},{"q":"Awalan me- pada 'hapus' menjadi …","o":["menghapus","mehapu","menhapus","memhapus"],"a":0,"e":"Contoh Bab 2: me- + hapus menjadi menghapus."},{"q":"Awalan me- pada 'kira' menjadi …","o":["mengira","mekira","menkira","memkira"],"a":0,"e":"Contoh Bab 2: me- + kira menjadi mengira."},{"q":"Awalan me- pada 'lem' menjadi …","o":["mengelem","melem","menglem","memlem"],"a":0,"e":"Contoh Bab 2: me- + lem menjadi mengelem."},{"q":"Kalimat majemuk setara adalah …","o":["gabungan kalimat tunggal yang setara","kalimat tanpa predikat","kalimat satu kata","kalimat yang tidak memiliki hubungan"],"a":0,"e":"Bab 2 menjelaskan kalimat majemuk setara sebagai gabungan kalimat-kalimat tunggal yang setara."},{"q":"Kata hubung untuk penjumlahan dalam materi adalah …","o":["dan","tetapi","atau","melainkan"],"a":0,"e":"'Dan' digunakan untuk menghubungkan unsur yang ditambahkan."},{"q":"Kata hubung pertentangan yang dicontohkan adalah …","o":["tetapi","dan","atau","sedangkan saja"],"a":0,"e":"Materi memberi contoh kalimat majemuk setara bertentangan dengan 'tetapi'."},{"q":"Kata hubung pemilihan adalah …","o":["atau","dan","tetapi","sedangkan"],"a":0,"e":"Materi menggunakan 'atau' untuk pilihan."},{"q":"Kalimat 'Ibu Guru membacakan cerita dan Cici menyimak' termasuk …","o":["majemuk setara penjumlahan","majemuk bertingkat","kalimat tunggal","kalimat tanya"],"a":0,"e":"Dua kalimat tunggal dihubungkan dengan 'dan'."},{"q": ment('div');d.className='q';d.innerHTML='<h3>'+(i+1)+'. '+x.q+'</h3>'+x.o.map((v,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+v+'</label>').join('');quiz.appendChild(d)});function check(){let score=0,answered=0;data.forEach((x,i)=>{const z=document.querySelector('input[name=q'+i+']:checked');if(z){answered++;if(+z.value===x.a)score++}});document.getElementById('result').innerHTML='Nilai: <b>'+Math.round(score/data.length*100)+'</b> / 100 &nbsp; | &nbsp; Benar: '+score+' dari '+data.length+' &nbsp; | &nbsp; Terjawab: '+answered+'/'+data.length+'.';document.getElementById('review').style.display='none'}function correction(){let html='<h2>📝 Koreksi Jawaban</h2><p>Jawaban benar dan penjelasan berdasarkan materi latihan.</p>';data.forEach((x,i)=>{const z=document.querySelector('input[name=q'+i+']:checked');const ok=z&&+z.value===x.a;html+='<div class="'+(ok?'ok':'bad')+'"><b>'+(i+1)+'. '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban benar: <b>'+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+'</b><br>'+x.e+'</div>'});const r=document.getElementById('review');r.innerHTML=html;r.style.display='block';r.scrollIntoView({behavior:'smooth'})}</script></body></html>
