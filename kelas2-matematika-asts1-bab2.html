<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latihan ASTS 1 — Bab 2</title><style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:linear-gradient(135deg,#eef3ff,#e8f5e9);color:#263238}.top{background:linear-gradient(135deg,#283593,#1565c0);color:#fff;text-align:center;padding:32px 16px}.wrap{max-width:900px;margin:auto;padding:20px}.info,.q,.result,.review,.saved{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.q h3{margin:8px 0 14px}.opt{display:block;padding:11px;margin:8px 0;border:1px solid #ddd;border-radius:10px;cursor:pointer}.actions{position:sticky;bottom:0;background:#ffffffee;padding:12px;border-radius:14px;box-shadow:0 -4px 15px #0002;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;color:#fff;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.check{background:#1565c0}.corr{background:#6a1b9a}.save{background:#2e7d32}.reset{background:#546e7a}.ok{border-left:6px solid #2e7d32;padding:12px;background:#f1f8e9;margin:10px 0;border-radius:10px}.bad{border-left:6px solid #c62828;padding:12px;background:#ffebee;margin:10px 0;border-radius:10px}.solution{margin-top:8px;padding:10px;background:#fff;border-radius:8px}.tag{font-weight:800;color:#3949ab}.score{font-size:42px;font-weight:900;color:#ef6c00}.home{color:#fff;text-decoration:none}
</style></head><body>
<header class="top"><div>📚 MATEMATIKA KELAS 2</div><h1>Latihan ASTS 1 — Bab 2</h1><p>Bab 2: Penjumlahan dan Pengurangan</p><a class="home" href="kelas2-matematika-asts1-menu.html">← Kembali ke ASTS 1</a></header>
<main class="wrap"><div class="info"><label><b>Nama siswa:</b> <input id="nama" style="padding:9px;border-radius:8px;border:1px solid #ccc"></label><p>Kerjakan semua soal. Setelah selesai gunakan <b>Periksa Nilai</b>. Gunakan <b>Periksa Jawaban</b> untuk melihat koreksi dan cara mengerjakan setiap soal.</p></div><div id="quiz"></div><div class="actions"><button id="checkBtn" class="btn check">✅ Periksa Nilai</button><button id="corrBtn" class="btn corr">📝 Periksa Jawaban</button><button id="saveBtn" class="btn save">💾 Simpan Nilai</button><button id="resetBtn" class="btn reset">🔄 Ulangi</button></div><div id="result" class="result">Belum diperiksa.</div><div id="saved" class="saved" style="display:none"></div><div id="review" class="review" style="display:none"></div></main>
<script>
const data=[{"q":"Hasil dari 8 + 6 adalah ...","o":["12","13","14","15"],"a":2,"e":"Mulai dari 8 lalu maju 6 langkah: 9, 10, 11, 12, 13, 14. Jadi hasilnya 14."},{"q":"Hasil dari 5 + 6 adalah ...","o":["10","11","12","13"],"a":1,"e":"5 + 6 = 11. Cara lain: 6 dipisah menjadi 5 dan 1, sehingga 5 + 5 = 10 lalu +1 = 11."},{"q":"Hasil dari 18 + 11 adalah ...","o":["27","28","29","30"],"a":2,"e":"18 + 11 = 18 + 10 + 1 = 28 + 1 = 29."},{"q":"Hasil dari 28 + 14 adalah ...","o":["40","41","42","43"],"a":2,"e":"28 + 14 = 28 + 10 + 4 = 38 + 4 = 42."},{"q":"Hasil dari 25 + 7 adalah ...","o":["31","32","33","34"],"a":2,"e":"25 ditambah 7 berarti maju 7 langkah: 26, 27, 28, 29, 30, 31, 32. Jadi 32."},{"q":"Hasil dari 8 − 2 adalah ...","o":["5","6","7","10"],"a":1,"e":"Dari 8 mundur 2 langkah: 7 lalu 6. Jadi 8 − 2 = 6."},{"q":"Hasil dari 16 − 9 adalah ...","o":["6","7","8","9"],"a":1,"e":"16 dikurangi 9. Bisa memisahkan 9 menjadi 6 dan 3: 16 − 6 = 10, lalu 10 − 3 = 7."},{"q":"Hasil dari 17 − 3 adalah ...","o":["13","14","15","16"],"a":1,"e":"17 mundur 3 langkah: 16, 15, 14. Jadi hasilnya 14."},{"q":"Hasil dari 47 − 34 adalah ...","o":["11","12","13","14"],"a":2,"e":"Kurangkan puluhan: 4 − 3 = 1 puluhan. Kurangkan satuan: 7 − 4 = 3 satuan. Jadi 13."},{"q":"Hasil dari 45 − 29 adalah ...","o":["14","15","16","17"],"a":2,"e":"Karena 5 tidak cukup untuk dikurangi 9, pinjam 1 puluhan: 45 menjadi 3 puluhan dan 15 satuan. 15 − 9 = 6 dan 3 − 2 = 1, jadi 16."},{"q":"Asma membaca 18 halaman Al-Qur'an pada hari Senin dan 11 halaman pada hari Selasa. Berapa halaman yang dibaca Asma seluruhnya?","o":["27","28","29","30"],"a":2,"e":"Soal meminta jumlah seluruh halaman, jadi gunakan penjumlahan: 18 + 11 = 29 halaman."},{"q":"Asma memiliki 19 buku. Ia memberikan 3 buku kepada temannya. Berapa buku yang tersisa?","o":["15","16","17","18"],"a":1,"e":"Karena buku diberikan, jumlah berkurang. Hitung 19 − 3 = 16 buku."},{"q":"Adam membaca Al-Qur'an 23 halaman. Asma membaca 12 halaman. Berapa selisih halaman yang mereka baca?","o":["9","10","11","12"],"a":2,"e":"Selisih diperoleh dengan pengurangan: 23 − 12 = 11 halaman."},{"q":"Di masjid ada 15 jamaah laki-laki. Jumlah jamaah perempuan 3 orang lebih sedikit daripada laki-laki. Berapa jamaah perempuan?","o":["10","11","12","13"],"a":2,"e":"Perempuan 3 orang lebih sedikit, jadi 15 − 3 = 12 orang."},{"q":"Setelah mengetahui jamaah perempuan 12 orang dan jamaah laki-laki 15 orang, berapa jumlah seluruh jamaah?","o":["25","26","27","30"],"a":2,"e":"Jumlah seluruh jamaah = 15 + 12 = 27. Jadi pilihan yang benar seharusnya 27; periksa kembali opsi: pilihan C adalah 27."}];
let last=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function render(){quiz.innerHTML=data.map((x,i)=>'<section class="q"><span class="tag">Soal '+(i+1)+'</span><h3>'+esc(x.q)+'</h3>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> <b>'+String.fromCharCode(65+j)+'.</b> '+esc(o)+'</label>').join('')+'</section>').join('');}
function get(i){const x=document.querySelector('input[name="q'+i+'"]:checked');return x?+x.value:null}
function check(){let benar=0,dijawab=0;data.forEach((x,i)=>{const s=get(i);if(s!==null)dijawab++;if(s===x.a)benar++});last={benar,dijawab,total:data.length,nilai:Math.round(benar/data.length*100)};result.innerHTML='<h2>📊 Hasil</h2><div class="score">'+last.nilai+'</div><p>Benar <b>'+benar+'</b> dari '+data.length+' soal. Dijawab <b>'+dijawab+'</b>.</p>'}
function correction(){if(!last)check();let h='<h2>📝 Koreksi Jawaban dan Cara Mengerjakan</h2>';data.forEach((x,i)=>{const s=get(i),ok=s===x.a;h+='<div class="'+(ok?'ok':'bad')+'"><b>Soal '+(i+1)+' — '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban kamu: <b>'+esc(s===null?'Belum dijawab':x.o[s])+'</b><br>Jawaban benar: <b>'+esc(x.o[x.a])+'</b><div class="solution"><b>📌 Cara mengerjakan:</b> '+esc(x.e)+'</div></div>'});review.innerHTML=h;review.style.display='block';review.scrollIntoView({behavior:'smooth'})}
function saveScore(){if(!last)check();const nama=(document.getElementById('nama').value||'Siswa').trim();const key='nilai-matematika-kelas2-asts1';const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nama,nilai:last.nilai,benar:last.benar,total:last.total,bab:'Bab 2: Penjumlahan dan Pengurangan',waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(key,JSON.stringify(arr.slice(0,100)));saved.textContent='✅ Nilai tersimpan untuk '+nama+': '+last.nilai+' ('+last.benar+'/'+last.total+').';saved.style.display='block'}
function resetQuiz(){render();last=null;result.textContent='Belum diperiksa.';review.style.display='none';saved.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('DOMContentLoaded',()=>{render();checkBtn.onclick=check;corrBtn.onclick=correction;saveBtn.onclick=saveScore;resetBtn.onclick=resetQuiz});
</script></body></html>
