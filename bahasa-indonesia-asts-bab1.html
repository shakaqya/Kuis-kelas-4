q":"Kata 'masker' pada teks pandemi berarti …","o":["kain penutup mulut dan hidung","alat untuk menulis","baju pelindung kaki","tempat menyimpan buku"],"a":0,"e":"Pada latihan mencocokkan makna, masker dipasangkan dengan kain penutup mulut dan hidung."}];const quiz=document.getElementById('quiz');data.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<h3>'+(i+1)+'. '+x.q+'</h3>'+x.o.map((v,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+v+'</label>').join('');quiz.appendChild(d)});function check(){let score=0,answered=0;data.forEach((x,i)=>{const z=document.querySelector('input[name=q'+i+']:checked');if(z){answered++;if(+z.value===x.a)score++}});document.getElementById('result').innerHTML='Nilai: <b>'+Math.round(score/data.length*100)+'</b> / 100 &nbsp; | &nbsp; Benar: '+score+' dari '+data.length+' &nbsp; | &nbsp; Terjawab: '+answered+'/'+data.length+'.';document.getElementById('review').style.display='none'}function correction(){let html='<h2>📝 Koreksi Jawaban</h2><p>Jawaban benar dan penjelasan berdasarkan materi latihan.</p>';data.forEach((x,i)=>{const z=document.querySelector('input[name=q'+i+']:checked');const ok=z&&+z.value===x.a;html+='<div class="'+(ok?'ok':'bad')+'"><b>'+(i+1)+'. '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban benar: <b>'+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+'</b><br>'+x.e+'</div>'});const r=document.getElementById('review');r.innerHTML=html;r.style.display='block';r.scrollIntoView({behavior:'smooth'})}</script></body></html>
