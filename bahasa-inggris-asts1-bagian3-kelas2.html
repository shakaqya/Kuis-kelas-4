<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTS 1 Bagian 3 — English Grade 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#e3f2fd);color:#263238}.top{background:linear-gradient(135deg,#1565c0,#2e7d32);color:#fff;text-align:center;padding:30px 15px}.wrap{max-width:900px;margin:auto;padding:18px 14px}.card,.q,.student,.result,.review{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.q h3{line-height:1.5}.opt{display:block;border:1px solid #d5dde5;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.opt:hover{background:#f1f8ff}.actions{position:sticky;bottom:0;background:#ffffffed;padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer;color:#fff}.check{background:#2e7d32}.corr{background:#1565c0}.save{background:#00897b}.reset{background:#6d4c41}.home{background:#fff;color:#1565c0;text-decoration:none;display:inline-block}.student input{width:100%;padding:11px;border:1px solid #ccd6df;border-radius:9px;font-size:16px}.ok,.bad{padding:12px;border-radius:10px;margin:9px 0}.ok{background:#edf8ef;border-left:5px solid #2e7d32}.bad{background:#fff1f1;border-left:5px solid #c62828}.solution{background:#e3f2fd;border-radius:9px;padding:11px;margin-top:8px;line-height:1.55}.saved{display:none;background:#e8f5e9;color:#1b5e20;padding:12px;border-radius:10px}.review{display:none}</style></head><body><header class="top"><h1>🇬🇧 ASTS 1 Bagian 3</h1><p>English — Grade 2 • Where We Live & Places in Town</p><a class="btn home" href="bahasa-inggris-asts1-menu-kelas2.html">🏠 Menu Bahasa Inggris</a></header><main class="wrap"><section class="card"><b>Instructions:</b> Answer all 15 questions. Then choose <b>Periksa Nilai</b>. Use <b>Periksa Jawaban</b> to see the correct answer and the explanation for every question.</section><section class="student"><b>Student name</b><input id="nama" placeholder="Write student name"></section><div id="quiz"></div><div class="actions"><button class="btn check" onclick="check()">✅ Periksa Nilai</button><button class="btn corr" onclick="correction()">📝 Periksa Jawaban</button><button class="btn save" onclick="saveScore()">💾 Simpan Nilai</button><button class="btn reset" onclick="resetQuiz()">🔄 Ulangi</button></div><div id="saved" class="saved"></div><section id="result" class="result">Belum diperiksa.</section><section id="review" class="review"></section></main><script>const data=[{"q":"Which place can you go to see a film? ","o":["cinema","hospital","school","café"],"a":0,"e":"A cinema is the place shown for watching films."},{"q":"Complete: 'Has your town got a swimming pool?' — 'Yes, ...'","o":["it has","it have","has it","it is"],"a":0,"e":"The material models 'Yes, it has.' for 'Has your town got ...?'"},{"q":"Which place is used for catching a train? ","o":["train station","playground","park","shop"],"a":0,"e":"The town picture labels a train station."},{"q":"Complete: 'The fish is ... the rock.'","o":["behind","likes","has","does"],"a":0,"e":"Bab 3 teaches the preposition 'behind' and gives 'The fish is behind the rock.'"},{"q":"Which preposition means in the middle of two things? ","o":["between","behind","in front of","next"],"a":0,"e":"'Between' is used when something is in the middle of two things."},{"q":"Complete: 'The fish is ... the tree and the rock.'","o":["between","behind","on","under"],"a":0,"e":"The example sentence in Bab 3 is 'The fish is between the tree and the rock.'"},{"q":"In the story 'The tree on the track', what is on the train track? ","o":["a tree","a car","a tiger","a school"],"a":0,"e":"The story repeatedly says there is a tree on the track."},{"q":"Who tries to stop the train in the story? ","o":["Flash","the café","the tree","the hospital"],"a":0,"e":"Flash tells the driver to stop the train."},{"q":"Which sentence is correct? ","o":["The tree is next to the track.","The tree are next to the track.","The tree next the track.","The tree is next the track."],"a":0,"e":"The correct pattern is 'The tree is next to the track.'"},{"q":"Read the town text: 'Noah goes to the swimming pool.' When does Noah go there? ","o":["on Mondays and Thursdays","every night","at seven o'clock","on Sundays only"],"a":0,"e":"The Bab 3 reading says Noah goes to the swimming pool on Mondays and Thursdays."},{"q":"What is Tika's favourite place in town? ","o":["the park","the hospital","the station","the school"],"a":0,"e":"The Bab 3 reading says Tika's favourite place is the park."},{"q":"Which place is described as having big slides and a playground? ","o":["park","hospital","cinema","café"],"a":0,"e":"The reading about Tika says she really likes playing on the big slides in the park."},{"q":"On the town grid, how are places located? ","o":["with letters and numbers","with colours only","with clocks","with animal names"],"a":0,"e":"Bab 3 explains that some maps use letters and numbers to find places."},{"q":"Which place is next to the cinema in the map example? ","o":["café","hospital","school","market"],"a":0,"e":"The example says: 'My town has got a museum. It's next to the cinema.' The town-grid activity also teaches location using adjacent places."},{"q":"Complete: 'The bus stop is ... the shop and the cinema.'","o":["between","behind","under","inside"],"a":0,"e":"The revision page uses the preposition 'between' for a bus stop located between the shop and cinema."}];let last=null;function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function render(){quiz.innerHTML=data.map((x,i)=>'<section class="q"><h3>'+(i+1)+'. '+esc(x.q)+'</h3>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</section>').join('')}function sel(i){const x=document.querySelector('input[name="q'+i+'"]:checked');return x===null?null:+x.value}function check(){let b=0,d=0;data.forEach((x,i)=>{const s=sel(i);if(s!==null)d++;if(s===x.a)b++});last={b,d,n:data.length,nilai:Math.round(b/data.length*100)};result.innerHTML='<h2>📊 Hasil</h2><div style="font-size:42px;font-weight:900;color:#2e7d32">'+last.nilai+'</div><p>Benar <b>'+last.b+'</b> dari '+last.n+' soal. Dijawab: <b>'+last.d+'</b>.</p>'}function correction(){if(!last)check();let h='<h2>📝 Koreksi Jawaban & Cara Mengerjakan</h2>';data.forEach((x,i)=>{const s=sel(i),ok=s===x.a;h+='<div class="'+(ok?'ok':'bad')+'"><b>Soal '+(i+1)+' — '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban kamu: <b>'+esc(s===null?'Belum dijawab':x.o[s])+'</b><br>Jawaban benar: <b>'+esc(x.o[x.a])+'</b><div class="solution"><b>📌 Cara mengerjakan:</b><br>'+esc(x.e)+'</div></div>'});review.innerHTML=h;review.style.display='block';review.scrollIntoView({behavior:'smooth'})}function saveScore(){if(!last)check();const nama=(document.getElementById('nama').value||'Siswa').trim();const key='nilai-asts1-english-grade2-bag'+3;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nama,nilai:last.nilai,benar:last.b,total:last.n,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(key,JSON.stringify(arr.slice(0,50)));saved.textContent='✅ Nilai tersimpan untuk '+nama+': '+last.nilai+' ('+last.b+'/'+last.n+').';saved.style.display='block'}function resetQuiz(){render();last=null;result.textContent='Belum diperiksa.';review.style.display='none';saved.style.display='none';scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
