<!doctype html><html lang="jv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Jawa Kelas 2 — Quiz 2</title><style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#fff8e1,#e8f5e9);color:#263238}.top{background:linear-gradient(135deg,#6a1b9a,#1565c0);color:#fff;text-align:center;padding:30px 15px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #0002}.home{display:inline-block;text-decoration:none;background:#fff;color:#6a1b9a;padding:10px 15px;border-radius:10px;font-weight:800;margin-top:12px}.q{border-top:1px solid #ddd;padding:18px 0}.q p{font-size:18px;margin:8px 0 12px}.read{background:#fff8e1;border-left:5px solid #f9a825;padding:14px;border-radius:10px;line-height:1.7;margin:10px 0}.choice{display:flex;gap:8px;align-items:center;padding:12px;border:2px solid #ddd;border-radius:10px;margin:7px 0;cursor:pointer}.choice input{width:18px;height:18px}.choice.correct{background:#c8e6c9;border-color:#2e7d32}.choice.wrong{background:#ffcdd2;border-color:#c62828}.feedback{font-weight:800;margin-top:8px;padding:10px;border-radius:9px}.feedback.ok{background:#e8f5e9;color:#2e7d32}.feedback.bad{background:#ffebee;color:#c62828}.submit{width:100%;padding:15px;background:#2e7d32;color:#fff;border:0;border-radius:11px;font-size:17px;font-weight:bold;cursor:pointer}.result{display:none;background:#f1f8e9;border:2px solid #81c784}.score{font-size:52px;font-weight:bold;color:#2e7d32;text-align:center}.badge{display:inline-block;background:#ede7f6;color:#6a1b9a;padding:7px 12px;border-radius:20px;font-weight:800}.enhanced-review{margin:20px 0;padding:18px;background:#fff;border-radius:20px;box-shadow:0 6px 20px #0002;border:2px solid #dbe7ef}.enhanced-review h2{margin-top:0}.er-card{margin:14px 0;padding:15px;border-radius:16px;background:#f8fbff;border:1px solid #dbe7ef}.er-question{font-weight:900;font-size:18px;line-height:1.5}.er-options{margin:10px 0}.er-opt{padding:7px 10px;margin:5px 0;border-radius:9px;background:#fff}.er-opt.selected{outline:2px solid #ffb300}.er-opt.correct{background:#e8f5e9;border-left:5px solid #43a047}.er-opt.wrong{background:#ffebee;border-left:5px solid #e53935}.er-method{margin-top:12px;padding:12px;border-radius:14px;background:#eef7ff}.er-method ol{margin:7px 0 0 22px;padding:0}.er-flow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}.er-step{padding:7px 10px;border-radius:10px;background:#e3f2fd;font-weight:800}.er-arrow{font-weight:900;font-size:20px}.er-existing{margin-top:10px;padding:10px;border-radius:10px;background:#fff}</style></head><body><header class="top"><h1>📚 Bahasa Jawa Kelas 2</h1><p>Quiz 2 — Piwulang 1: Mangerteni Rasa</p><a class="home" href="bahasa-jawa-menu.html">↩️ Menu Bahasa Jawa</a></header><main class="wrap"><div class="card"><span class="badge">40 Soal Baru</span><h2>📝 Quiz 2</h2><p>Pilih siji jawaban sing paling bener. Sawetara soal nganggo <b>bacaan</b> supaya bisa maca dhisik banjur mangsuli.</p><form id="quiz"></form><button class="submit" type="button" onclick="check()">✅ PERIKSA JAWABAN</button></div><div id="result" class="card result"><h2>🎉 Asil Quiz 2</h2><div id="score" class="score"></div><p id="msg" style="text-align:center"></p></div></main><script>const qs=[['Rasa jeruk mateng biasane ....',['A. kecut','B. legi','C. asin','D. sepa'],1],['Rasa uyah yaiku ....',['A. asin','B. pait','C. legi','D. gurih'],0],['Rasa lombok yaiku ....',['A. sepa','B. pedhes','C. kecut','D. pait'],1],['Panganan sing rasane ora ana yaiku ....',['A. gurih','B. legi','C. sepa','D. asin'],2],['Rasa kopi umume ....',['A. pait','B. legi','C. kecut','D. asin'],0],['Rasa krupuk sing enak bisa diarani ....',['A. gurih','B. sepa','C. pait','D. kecut'],0],['Yen menang lomba, bocah biasane rumangsa ....',['A. sedhih','B. seneng','C. lara','D. cuwa'],1],['Yen barang sing dikarepake ora dadi dituku, bisa rumangsa ....',['A. cuwa','B. sumringah','C. legi','D. pegel'],0],['Yen awak kesel sawise olahraga, bisa rumangsa ....',['A. pegel','B. seneng','C. asin','D. cuwa'],0],['Yen ora duwe tenaga, awak krasa ....',['A. lemes','B. pedhes','C. sumringah','D. bingung'],0],['<div class="read"><b>📖 Bacaan:</b> Jaka Tarub lunga menyang alas kanggo golek manuk. Ing cedhak sendhang, dheweke krungu swara para wanita padha ngguyu.</div>Ing endi Jaka Tarub krungu swara wanita?',['A. Ing pasar','B. Ing sendhang','C. Ing sekolah','D. Ing lumbung'],1],['<div class="read"><b>📖 Bacaan:</b> Jaka Tarub ndeleng para widadari lagi adus. Dheweke banjur njupuk siji selendhang lan ndhelikake.</div>Apa barang sing dijupuk Jaka Tarub?',['A. Dandang','B. Pari','C. Selendhang','D. Kertas'],2],['<div class="read"><b>📖 Bacaan:</b> Salah siji widadari ora bisa bali menyang kahyangan amarga selendhange ilang. Jaka Tarub banjur nulungi dheweke.</div>Napa widadari kuwi ora bisa bali?',['A. Ora ngerti dalan','B. Selendhange ilang','C. Kesandhung','D. Lara'],1],['<div class="read"><b>📖 Bacaan:</b> Widadari kuwi jenenge Dewi Nawang Wulan. Jaka Tarub banjur omah-omah karo dheweke.</div>Sapa jenenge widadari kasebut?',['A. Dewi Nawang Sih','B. Dewi Kunti','C. Dewi Nawang Wulan','D. Dewi Sinta'],2],['<div class="read"><b>📖 Bacaan:</b> Jaka Tarub lan Nawang Wulan duwe anak wadon sing jenenge Dewi Nawang Sih.</div>Sapa jenenge anak Jaka Tarub?',['A. Dewi Nawang Sih','B. Dewi Nawang Wulan','C. Dewi Srikandi','D. Dewi Kunti'],0],['<div class="read"><b>📖 Bacaan:</b> Nawang Wulan wis menehi pepeling supaya Jaka Tarub ora mbukak lawang lumbung nalika dheweke ora ana. Nanging Jaka Tarub tetep mbukak.</div>Apa sing ditindakake Jaka Tarub?',['A. Nutup lumbung','B. Mbukak lawang lumbung','C. Tuku pari','D. Golek manuk'],1],['<div class="read"><b>📖 Bacaan:</b> Ing lumbung, Nawang Wulan weruh tumpukan pari. Kekuwatane banjur ilang lan dheweke kudu ngolah pari dhewe.</div>Apa sing ditemokake ing lumbung?',['A. Tumpukan pari','B. Uyah','C. Lombok','D. Dluwang'],0],['<div class="read"><b>📖 Bacaan:</b> Nalika nggoleki pari, Nawang Wulan nemokake selendhang sing biyen didhelikake Jaka Tarub.</div>Apa sing ditemokake Nawang Wulan?',['A. Manuk','B. Selendhang','C. Dandang','D. Kertas'],1],['<div class="read"><b>📖 Bacaan:</b> Sawise nemokake selendhang, Nawang Wulan bisa bali menyang kahyangan.</div>Nawang Wulan bali menyang ....',['A. pasar','B. sekolah','C. kahyangan','D. alas'],2],['<div class="read"><b>📖 Bacaan:</b> Jaka Tarub nduweni kabiasaan golek manuk ing alas. Nalika tekan sendhang, dheweke weruh para widadari.</div>Apa kegemaran Jaka Tarub?',['A. Golek manuk','B. Nandur pari','C. Mancing','D. Dodolan'],0],['Puntadewa iku Pandhawa nomer ....',['A. siji','B. loro','C. telu','D. papat'],0],['Werkudara iku Pandhawa nomer ....',['A. siji','B. loro','C. papat','D. lima'],1],['Pandhawa cacahe ana .... sedulur.',['A. telu','B. papat','C. lima','D. enem'],2],['Sapa Pandhawa nomer telu?',['A. Arjuna','B. Nakula','C. Sadewa','D. Werkudara'],0],['Sapa Pandhawa nomer papat?',['A. Puntadewa','B. Nakula','C. Arjuna','D. Sadewa'],1],['Sapa Pandhawa sing paling ragil?',['A. Puntadewa','B. Werkudara','C. Nakula','D. Sadewa'],3],['Pandhawa diarani kaya mangkono amarga padha dadi anaké ....',['A. Tarub','B. Pandhu','C. Arjuna','D. Werkudara'],1],['Tembung nunggal teges karo "nom" yaiku ....',['A. mudha','B. reged','C. banter','D. culika'],0],['Tembung nunggal teges karo "dluwang" yaiku ....',['A. kertas','B. atis','C. bodho','D. tunggal'],0],['Tembung nunggal teges karo "pinter" yaiku ....',['A. kemproh','B. wasis','C. reged','D. banter'],1],['Tembung kosok balen saka "resik" yaiku ....',['A. legi','B. reged','C. wasis','D. atis'],1],['Tembung kosok balen saka "pinter" yaiku ....',['A. bodho','B. lurus','C. tunggal','D. atis'],0],['Tembung kosok balen saka "andhap" yaiku ....',['A. inggil','B. jejeg','C. culika','D. reged'],0],['Tembung kosok balen saka "rindhik" yaiku ....',['A. banter','B. atis','C. mudha','D. lurus'],0],['Tembung nunggal teges karo "isinan" yaiku ....',['A. clingus','B. banter','C. bodho','D. reged'],0],['Tembung "sepa" tegese ....',['A. padhang polatane','B. ora ana rasane','C. mandeng terus','D. kucem polatane'],1],['Tembung "sumringah" tegese ....',['A. padhang polatane','B. ora ana rasane','C. getun','D. ngumpet-ngumpet'],0],['Nulis jejeg sinambung nggunakake aksara ....',['A. Jawa','B. Latin','C. Arab','D. Jepang'],1],['Ukara sing kalebu tulisan jejeg sinambung yaiku ....',['A. Aku tuku sega.','B. 12345','C. 🌺📚','D. ABCD tanpa ukara'],0]];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="q"><b>Soal ${i+1}</b><p>${q[0]}</p>${q[1].map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}">${c}</label>`).join('')}<div id="fb${i}" class="feedback"></div></div>`);function check(){let score=0;qs.forEach((q,i)=>{document.querySelectorAll(`[name=q${i}]`).forEach(x=>x.parentElement.classList.remove('correct','wrong'));const fb=document.getElementById('fb'+i);fb.className='feedback';const a=document.querySelector(`[name=q${i}]:checked`);if(!a){fb.classList.add('bad');fb.innerHTML='⚠️ <b>Belum dijawab.</b> Jawaban benar: <b>'+q[1][q[2]]+'</b>'}else if(+a.value!==q[2]){a.parentElement.classList.add('wrong');fb.classList.add('bad');fb.innerHTML='✗ <b>Salah.</b> Jawaban benar: <b>'+q[1][q[2]]+'</b>'}else{a.parentElement.classList.add('correct');fb.classList.add('ok');fb.innerHTML='✓ <b>Benar!</b>';score++}});document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+' / '+qs.length;document.getElementById('msg').textContent=score>=32?'Apik banget!':score>=24?'Apik, terus latihan maneh!':'Ayo maca materi maneh banjur coba maneh.';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script><script src="quiz-review-helper.js"></script><script data-enhanced-correction-v2>(function(){function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function build(){const old=document.getElementById('enhancedReview');if(old)old.remove();const radios=[...document.querySelectorAll('input[type="radio"][name]')],names=[];const seen=new Set();radios.forEach(r=>{if(!seen.has(r.name)){seen.add(r.name);names.push(r.name)}});if(!names.length)return;const source=[...document.querySelectorAll('.good,.bad')];const cards=[];names.forEach((name,i)=>{const r=document.querySelector('input[name="'+CSS.escape(name)+'"]');const box=r&&r.closest('.q,.card,.question,section,article,div');if(!box)return;const title=box.querySelector('h2,h3,h4,p')?.innerText||('Soal '+(i+1));const labels=[...box.querySelectorAll('label')].filter(l=>l.querySelector('input[type="radio"]'));const chosen=box.querySelector('input[type="radio"]:checked');const existing=source[i]?.innerHTML||'';const opts=labels.map(l=>{const inp=l.querySelector('input[type="radio"]'),txt=l.innerText.trim(),selected=chosen&&inp===chosen;return '<div class="er-opt '+(selected?'selected':'')+'">'+esc(txt)+(selected?' <b>← jawabanmu</b>':'')+'</div>'}).join('');cards.push('<div class="er-card"><div class="er-question">📝 '+esc(title)+'</div><div class="er-options">'+opts+'</div><div class="er-method"><b>📌 Cara mengerjakan</b><ol><li>Baca soal dengan teliti dan tentukan apa yang ditanyakan.</li><li>Perhatikan pilihan jawaban dan hubungkan dengan materi.</li><li>Bandingkan pilihan satu per satu, lalu pilih yang paling sesuai.</li></ol><div class="er-flow"><span class="er-step">📖 Baca</span><span class="er-arrow">→</span><span class="er-step">🧠 Pahami</span><span class="er-arrow">→</span><span class="er-step">🔎 Bandingkan</span><span class="er-arrow">→</span><span class="er-step">✅ Pilih</span></div></div>'+(existing?'<div class="er-existing"><b>🔍 Hasil koreksi:</b><br>'+existing+'</div>':'')+'</div>')});const wrap=document.createElement('section');wrap.id='enhancedReview';wrap.className='enhanced-review';wrap.innerHTML='<h2>📚 Soal & Cara Mengerjakan</h2><p>Soal ditampilkan kembali bersama jawabanmu dan hasil koreksi.</p>'+cards.join('');const target=document.querySelector('#review,#result,.result:last-of-type')||document.querySelector('form')||document.body;target.insertAdjacentElement('afterend',wrap);wrap.scrollIntoView({behavior:'smooth',block:'start'})}function hook(){document.querySelectorAll('button,input[type="button"],input[type="submit"]').forEach(b=>{if(b.dataset.erHook)return;if(/periksa|lihat nilai|lihat hasil|check quiz|check answer/i.test(b.innerText||b.value||'')){b.dataset.erHook='1';b.addEventListener('click',()=>setTimeout(build,120))}})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook()})();</script><script src="quiz-universal.js?v=20260922-1"></script></body></html>
