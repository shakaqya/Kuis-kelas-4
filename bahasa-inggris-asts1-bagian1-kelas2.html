<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTS 1 Bagian 1 — English Grade 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#e3f2fd);color:#263238}.top{background:linear-gradient(135deg,#1565c0,#2e7d32);color:#fff;text-align:center;padding:30px 15px}.wrap{max-width:900px;margin:auto;padding:18px 14px}.card,.q,.student,.result,.review{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.q h3{line-height:1.5}.opt{display:block;border:1px solid #d5dde5;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.opt:hover{background:#f1f8ff}.actions{position:sticky;bottom:0;background:#ffffffed;padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer;color:#fff}.check{background:#2e7d32}.corr{background:#1565c0}.save{background:#00897b}.reset{background:#6d4c41}.home{background:#fff;color:#1565c0;text-decoration:none;display:inline-block}.student input{width:100%;padding:11px;border:1px solid #ccd6df;border-radius:9px;font-size:16px}.ok,.bad{padding:12px;border-radius:10px;margin:9px 0}.ok{background:#edf8ef;border-left:5px solid #2e7d32}.bad{background:#fff1f1;border-left:5px solid #c62828}.solution{background:#e3f2fd;border-radius:9px;padding:11px;margin-top:8px;line-height:1.55}.saved{display:none;background:#e8f5e9;color:#1b5e20;padding:12px;border-radius:10px}.review{display:none}</style></head><body><header class="top"><h1>🇬🇧 ASTS 1 Bagian 1</h1><p>English — Grade 2 • Back to School & My Day</p><a class="btn home" href="bahasa-inggris-asts1-menu-kelas2.html">🏠 Menu Bahasa Inggris</a></header><main class="wrap"><section class="card"><b>Instructions:</b> Answer all 15 questions. Then choose <b>Periksa Nilai</b>. Use <b>Periksa Jawaban</b> to see the correct answer and the explanation for every question.</section><section class="student"><b>Student name</b><input id="nama" placeholder="Write student name"></section><div id="quiz"></div><div class="actions"><button class="btn check" onclick="check()">✅ Periksa Nilai</button><button class="btn corr" onclick="correction()">📝 Periksa Jawaban</button><button class="btn save" onclick="saveScore()">💾 Simpan Nilai</button><button class="btn reset" onclick="resetQuiz()">🔄 Ulangi</button></div><div id="saved" class="saved"></div><section id="result" class="result">Belum diperiksa.</section><section id="review" class="review"></section></main><script>const data=[{"q":"Which word means a place where books are kept? ","o":["bookcase","window","floor","chair"],"a":0,"e":"A bookcase is used to keep books. The classroom picture in Bab 1 labels a bookcase."},{"q":"Which sentence is correct? ","o":["There are a clock.","There is a clock.","There are clock.","There is some clock."],"a":1,"e":"Use 'There is' for one thing. So: There is a clock."},{"q":"Which classroom object is used for writing with coloured lines? ","o":["crayon","door","cupboard","floor"],"a":0,"e":"The Bab 1 classroom picture labels a crayon."},{"q":"What number comes after 66? ","o":["65","67","76","60"],"a":1,"e":"Count forward: 66, 67. So the answer is 67."},{"q":"Choose the correct instruction. ","o":["Open you book.","Open your book.","Opening your book.","You open book."],"a":1,"e":"The material uses the imperative 'Open your book, please.'"},{"q":"What is the opposite of 'Sit down'? ","o":["Stand up.","Go to school.","Get up.","Have lunch."],"a":0,"e":"The classroom commands pair 'Sit down' with 'Stand up'."},{"q":"At seven o'clock in the morning, which activity is shown in 'My day'? ","o":["get dressed","have dinner","go to bed","have lunch"],"a":0,"e":"Bab 1's My day sequence includes get up, get dressed, have breakfast, brush your teeth, go to school, and other daily activities."},{"q":"Complete: 'When do you have breakfast?' — 'At ... o'clock.'","o":["What's","eight","does","where"],"a":1,"e":"The example in Bab 1 says breakfast is at eight o'clock."},{"q":"Choose the correct sentence about a boy named Penny. ","o":["Penny walk home.","Penny walks home.","Penny walking home.","Penny walkes home."],"a":1,"e":"For a singular subject in the present simple, the verb takes -s: Penny walks home."},{"q":"Which sentence is correct? ","o":["She go to sleep.","She goes to sleep.","She going to sleep.","She go sleeping."],"a":1,"e":"With 'she' in the present simple, 'go' becomes 'goes'."},{"q":"In the story 'The burglars', what are the burglars taking? ","o":["a chair","a computer","a bookcase","a clock"],"a":1,"e":"The story says the two burglars are taking their computer."},{"q":"What does Thunder's family have for dinner in 'What a day'? ","o":["fish","chicken","cheese","peas"],"a":1,"e":"On page 12, Thunder says he loves chicken and has a bad day after the accident."},{"q":"If the clock shows 8:00, how do you say the time? ","o":["It's eight o'clock.","It's eight clocks.","It's eighty o'clock.","It's eight time."],"a":0,"e":"The material models the expression 'It's ... o'clock.'"},{"q":"Which Roman numeral means 6? ","o":["IV","V","VI","IX"],"a":2,"e":"The Bab 1 table gives VI = 6."},{"q":"Complete: 'What time is it?' — 'It's ... o'clock.'","o":["a time","three","times","clock"],"a":1,"e":"The question asks for a number followed by 'o'clock', for example 'It's three o'clock.'"}];let last=null;function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function render(){quiz.innerHTML=data.map((x,i)=>'<section class="q"><h3>'+(i+1)+'. '+esc(x.q)+'</h3>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</section>').join('')}function sel(i){const x=document.querySelector('input[name="q'+i+'"]:checked');return x===null?null:+x.value}function check(){let b=0,d=0;data.forEach((x,i)=>{const s=sel(i);if(s!==null)d++;if(s===x.a)b++});last={b,d,n:data.length,nilai:Math.round(b/data.length*100)};result.innerHTML='<h2>📊 Hasil</h2><div style="font-size:42px;font-weight:900;color:#2e7d32">'+last.nilai+'</div><p>Benar <b>'+last.b+'</b> dari '+last.n+' soal. Dijawab: <b>'+last.d+'</b>.</p>'}function correction(){if(!last)check();let h='<h2>📝 Koreksi Jawaban & Cara Mengerjakan</h2>';data.forEach((x,i)=>{const s=sel(i),ok=s===x.a;h+='<div class="'+(ok?'ok':'bad')+'"><b>Soal '+(i+1)+' — '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban kamu: <b>'+esc(s===null?'Belum dijawab':x.o[s])+'</b><br>Jawaban benar: <b>'+esc(x.o[x.a])+'</b><div class="solution"><b>📌 Cara mengerjakan:</b><br>'+esc(x.e)+'</div></div>'});review.innerHTML=h;review.style.display='block';review.scrollIntoView({behavior:'smooth'})}function saveScore(){if(!last)check();const nama=(document.getElementById('nama').value||'Siswa').trim();const key='nilai-asts1-english-grade2-bag'+1;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nama,nilai:last.nilai,benar:last.b,total:last.n,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(key,JSON.stringify(arr.slice(0,50)));saved.textContent='✅ Nilai tersimpan untuk '+nama+': '+last.nilai+' ('+last.b+'/'+last.n+').';saved.style.display='block'}function resetQuiz(){render();last=null;result.textContent='Belum diperiksa.';review.style.display='none';saved.style.display='none';scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
