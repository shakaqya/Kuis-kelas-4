<!doctype html><html lang="jv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latihan Tembang Gambuh — 20 Soal</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#fff8e1,#e8f5e9);color:#263238}.top{background:linear-gradient(135deg,#6a1b9a,#1565c0);color:#fff;text-align:center;padding:32px 15px}.wrap{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #0002}.field{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input{padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px}.q{border-top:1px solid #ddd;padding:18px 0}.q p{font-size:18px;line-height:1.55}.read{background:#fff8e1;border-left:5px solid #f9a825;padding:14px;border-radius:10px;line-height:1.8;margin:10px 0}.choice{display:flex;gap:8px;align-items:flex-start;padding:12px;border:2px solid #ddd;border-radius:10px;margin:7px 0;cursor:pointer}.choice input{width:18px;height:18px;margin-top:3px}.correct{background:#c8e6c9!important;border-color:#2e7d32!important}.wrong{background:#ffcdd2!important;border-color:#c62828!important}.feedback{font-weight:700;margin-top:8px;padding:10px;border-radius:9px}.ok{background:#e8f5e9;color:#2e7d32}.bad{background:#ffebee;color:#c62828}.btn{width:100%;padding:15px;border:0;border-radius:11px;background:#2e7d32;color:#fff;font-size:17px;font-weight:800;cursor:pointer;margin-top:12px}.secondary{background:#1565c0}.result{display:none;text-align:center;border:2px solid #81c784}.score{font-size:48px;font-weight:900;color:#2e7d32}.home{display:inline-block;text-decoration:none;background:#fff;color:#6a1b9a;padding:10px 15px;border-radius:10px;font-weight:800;margin-top:10px}.progress{height:12px;background:#ddd;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2e7d32}</style></head><body><header class="top"><h1>🎵 Latihan Tembang Gambuh</h1><p>Bab 2 — Latihan Baru, 20 Soal</p><a class="home" href="bahasa-jawi-menu.html">↩️ Menu Bahasa Jawi</a></header><main class="wrap"><section class="card"><h2>📝 Identitas Siswa</h2><div class="field"><input id="nama" placeholder="Nama siswa"><input id="kelas" placeholder="Kelas / No. Absen"></div><p>Nilai menggunakan sistem 100: setiap jawaban benar bernilai 5 poin.</p><div class="progress"><div class="bar" id="bar"></div></div><p id="count">0/20 dijawab</p></section><section class="card"><form id="quiz"></form><button class="btn" type="button" onclick="check()">✅ PERIKSA JAWABAN & HITUNG NILAI</button><button class="btn secondary" type="button" onclick="resetQuiz()">🔄 MULAI ULANG</button></section><section class="card result" id="result"><h2>🎉 Hasil Latihan</h2><div class="score" id="score"></div><p id="detail"></p><p id="message"></p><button class="btn secondary" onclick="saveHistory()">💾 SIMPAN HASIL DI PERANGKAT</button><button class="btn" onclick="location.reload()">📝 COBA LAGI</button></section></main><script>const qs=[
['Tembang Gambuh ing dokumen sumber nggawa piweling supaya wong ora nganti kebanjur nindakake polah sing ora jujur. Tumindak sing dadi pakulinan ala bisa nuwuhake ....',['A. kabecikan','B. awon','C. kawruh','D. kamulyan'],1],
['Ing pada kapisan ana ukara “Tanpa tutur katula-tula katali”. Yen diwenehi piweling sing becik, sikap sing trep yaiku ....',['A. ora gelem ngrungokake','B. nggatekake lan nindakake sing becik','C. ngguyu marang sing menehi pitutur','D. langsung ninggalake'],1],
['“Aja nganti kabanjur” ing tembang Gambuh ngemot piweling supaya tumindak ala ....',['A. diterusake','B. diwiwiti maneh','C. ora nganti kebablasen','D. didhelikake'],2],
['Wacan tembang nyebut “Barang polah ingkang nora jujur”. Ing urip saben dina, tuladha polah sing cocog karo piweling kasebut yaiku ....',['A. nyalin jawaban kanca nalika ujian','B. ngembalikan barang sing dudu duweke','C. ngakoni kesalahan','D. ngomong apa anane'],0],
['Wong sing wis ngerti yen tumindak ala bisa nggawa akibat ora becik kudune ....',['A. ngenteni nganti masalah gedhe','B. ngowahi pakulinan ala wiwit saiki','C. ngajak kanca nindakake sing padha','D. nganggep pitutur ora penting'],1],
['Wacan “Kabeh kanca-kancaku” ngajak para bocah supaya bebarengan ....',['A. turu','B. sinau','C. dolanan','D. lelungan'],1],
['Ing wacan “Maca lan nulis kudu ditelateni”, tembung “ditelateni” nuduhake yen maca lan nulis kudu ditindakake kanthi ....',['A. sregep lan sabar','B. kesusu','C. sembrana','D. sakarepe dhewe'],0],
['Ukara “Mumpung isih akeh wektu” menehi piweling supaya wektu kanggo sinau ....',['A. dibuwang','B. ditundha','C. dimanfaatake','D. dilalekake'],2],
['Yen bocah kesed, wacan kasebut nyebut akibaté yaiku ....',['A. dadi bodho','B. dadi sugih','C. dadi misuwur','D. dadi juara'],0],
['Sikap sing paling cocog karo isi wacan “Kabeh Kanca Kancaku” nalika sinau kelompok yaiku ....',['A. ora gelem melu','B. sinau bebarengan lan tekun','C. mung dolanan','D. ninggalake tugas'],1],
['Guru gatra ing tembang macapat nuduhake ....',['A. cacahing gatra utawa larik saben pada','B. swara pungkasan saben gatra','C. cacahing wanda saben gatra','D. jeneng panganggit'],0],
['Guru wilangan digunakake kanggo nemtokake ....',['A. cacahing pada','B. cacahing wanda saben gatra','C. swara pungkasan','D. irah-irahan'],1],
['Guru lagu utawa dhong-dhing gegayutan karo ....',['A. cacahing tembung','B. tibaning swara ing pungkasan gatra','C. cacahing larik','D. jeneng tembang'],1],
['Tembang Gambuh kalebu salah siji jinis ....',['A. tembang macapat','B. drama modern','C. novel','D. cerkak'],0],
['Miturut wacan sumber, siji pada tembang Gambuh dumadi saka .... gatra.',['A. papat','B. lima','C. enem','D. pitu'],1],
['Paugeran tembang Gambuh sing dicantumake ing wacan yaiku ....',['A. 7u, 10u, 12i, 8u, 8o','B. 8a, 8i, 8u, 8a, 8i','C. 10i, 10a, 8e, 7u, 9o','D. 12u, 6a, 8i, 8e, 7o'],0],
['Yen gatra kapisan tembang Gambuh nduweni guru lagu “u”, tegese swara pungkasan gatra kasebut yaiku ....',['A. a','B. i','C. u','D. o'],2],
['Ing dokumen sumber, tembang “Sekar Gambuh Ping Catur” kaanggit dening ....',['A. Ranggawarsita','B. Sri Susuhunan Pakubuwana IV','C. Ki Hajar Dewantara','D. Sunan Kalijaga'],1],
['Tembung “sekar” ing konteks tembang Jawa nduweni teges ....',['A. tembang','B. crita','C. aturan','D. ukara'],0],
['Nalika nggawe pameran teks Tembang Gambuh kanthi klompok, kegiatan kasebut bisa nglatih profil Pelajar Pancasila berupa ....',['A. kreatif lan bergotong royong','B. mandiri lan meneng wae','C. cepet lan menang dhewe','D. hafal lan ora kerja sama'],0]
];
const f=document.getElementById('quiz');qs.forEach((q,i)=>{f.innerHTML+=`<div class="q"><b>Soal ${i+1}</b><p>${q[0]}</p>${q[1].map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}">${c}</label>`).join('')}<div id="fb${i}" class="feedback"></div></div>`});
document.addEventListener('change',()=>{let n=0;qs.forEach((_,i)=>{if(document.querySelector(`[name=q${i}]:checked`))n++});document.getElementById('count').textContent=n+'/20 dijawab';document.getElementById('bar').style.width=(n/20*100)+'%'});
let last=null;function check(){let correct=0,answered=0;qs.forEach((q,i)=>{document.querySelectorAll(`[name=q${i}]`).forEach(x=>x.parentElement.classList.remove('correct','wrong'));let fb=document.getElementById('fb'+i);fb.className='feedback';let a=document.querySelector(`[name=q${i}]:checked`);if(!a){fb.classList.add('bad');fb.textContent='Belum dijawab. Jawaban benar: '+q[1][q[2]]}else{answered++;if(+a.value===q[2]){correct++;a.parentElement.classList.add('correct');fb.classList.add('ok');fb.textContent='Benar!'}else{a.parentElement.classList.add('wrong');fb.classList.add('bad');fb.textContent='Salah. Jawaban benar: '+q[1][q[2]]}}});let score=correct*5;last={nama:document.getElementById('nama').value.trim()||'Tanpa nama',kelas:document.getElementById('kelas').value.trim()||'-',correct,answered,score,waktu:new Date().toLocaleString('id-ID')};document.getElementById('result').style.display='block';document.getElementById('score').textContent=score;document.getElementById('detail').textContent=`Benar: ${correct} dari 20 • Dijawab: ${answered} • Kosong: ${20-answered}`;document.getElementById('message').textContent=score>=80?'Hasil sangat baik.':score>=60?'Hasil cukup baik, terus latihan.':'Ayo pelajari maneh materi Tembang Gambuh banjur coba maneh.';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};function saveHistory(){if(!last)return;let h=JSON.parse(localStorage.getItem('jawi_bab2_latihan20')||'[]');h.push(last);localStorage.setItem('jawi_bab2_latihan20',JSON.stringify(h));alert('Hasil berhasil disimpan di perangkat.')}function resetQuiz(){if(confirm('Mulai ulang dan hapus jawaban sekarang?'))location.reload()};</script></body></html>
