<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematika Kelas 2 — Bab 3 Latihan 2</title>
<style>
:root{--orange:#ef6c00;--pink:#ad1457;--ink:#263238;--green:#2e7d32}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#fff8e1,#e3f2fd);color:var(--ink)}header{background:linear-gradient(135deg,var(--orange),var(--pink));color:white;text-align:center;padding:28px 16px}header h1{margin:8px;font-size:clamp(25px,5vw,38px)}.wrap{max-width:900px;margin:auto;padding:18px 14px}.panel,.q{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit;flex:1;min-width:170px}button,.back{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:750;cursor:pointer;background:var(--orange);color:white}.secondary{background:#3949ab}.green{background:var(--green)}.dark{background:#455a64}.q h3{margin-top:0}.visual{display:flex;align-items:center;justify-content:center;background:#fffaf0;border:1px solid #ffe0b2;border-radius:14px;padding:10px;margin:12px 0;min-height:120px}.visual svg{max-width:100%;height:auto}.opts{display:grid;gap:9px}.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid #d8dee3;border-radius:11px;padding:11px;cursor:pointer}.opt input{flex:0 0 auto;min-width:auto;margin-top:5px}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#e8f5e9;line-height:1.55}.feedback.show{display:block}.bad{background:#ffebee}.status{font-weight:800}.small{font-size:13px;color:#607d8b}.history-item{border-bottom:1px solid #eee;padding:9px 0}.back{display:inline-block;text-decoration:none;background:white;color:var(--pink)}.qno{color:var(--pink);font-size:13px;font-weight:800;text-transform:uppercase}
</style></head><body>
<header><div>🍰 MATEMATIKA KELAS 2</div><h1>Bab 3 — Mengenal Pecahan</h1><p>Latihan 2 • 30 soal bergambar</p><a class="back" href="kelas2-matematika-menu.html">⬅ Kembali ke Matematika</a></header>
<main class="wrap"><section class="panel"><label for="student"><b>Nama siswa</b></label><div class="row" style="margin-top:8px"><input id="student" placeholder="Tulis nama siswa"><span id="progress" class="status">0/30 dijawab</span></div><p class="small">Pilih satu jawaban untuk setiap soal. Nilai maksimal 100.</p><div class="row"><button onclick="checkScore()">🧮 Periksa Nilai</button><button class="secondary" onclick="checkAnswers()">💡 Periksa Jawaban</button><button class="green" onclick="saveScore()">💾 Simpan Nilai</button><button class="dark" onclick="showHistory()">📚 Riwayat Nilai</button><button class="dark" onclick="resetQuiz()">🔄 Coba Lagi</button></div><div id="result" class="feedback"></div><div id="history" class="feedback"></div></section><div id="quiz"></div><section class="panel"><div class="row"><button onclick="checkScore()">🧮 Periksa Nilai</button><button class="secondary" onclick="checkAnswers()">💡 Periksa Jawaban</button><button class="green" onclick="saveScore()">💾 Simpan Nilai</button></div></section></main>
<script>
const questions=[{"t":"Sebuah kue dibagi menjadi 2 bagian sama besar. Satu bagian disebut ...","a":["Seperempat","Setengah","Sepertiga"],"c":1,"e":"Penyebut 2 berarti benda dibagi menjadi 2 bagian sama besar. Satu bagiannya adalah setengah (1/2).","v":"circle","n":2,"k":1},{"t":"Lingkaran dibagi menjadi 4 bagian sama besar. Satu bagian bernilai ...","a":["1/2","1/3","1/4"],"c":2,"e":"Satu dari empat bagian sama besar ditulis 1/4, dibaca seperempat.","v":"circle","n":4,"k":1},{"t":"Pada pecahan 1/2, angka 1 disebut ...","a":["Penyebut","Pembilang","Hasil"],"c":1,"e":"Angka di atas garis pecahan adalah pembilang. Angka 1 menunjukkan satu bagian yang diambil.","v":"fraction","n":2,"k":1},{"t":"Pada pecahan 1/4, angka 4 disebut ...","a":["Pembilang","Penjumlahan","Penyebut"],"c":2,"e":"Angka di bawah garis pecahan adalah penyebut. Angka 4 menunjukkan jumlah bagian sama besar.","v":"fraction","n":4,"k":1},{"t":"Manakah gambar yang menunjukkan setengah?","a":["Satu dari 4 bagian diarsir","Satu dari 2 bagian sama besar diarsir","Satu dari 3 bagian diarsir"],"c":1,"e":"Setengah berarti satu dari dua bagian yang sama besar, yaitu 1/2.","v":"circle","n":2,"k":1},{"t":"Satu persegi dibagi menjadi 4 kotak sama besar. Jika 1 kotak diwarnai, pecahannya ...","a":["1/4","1/2","3/4"],"c":0,"e":"Ada 4 kotak sama besar dan 1 yang diwarnai, jadi pecahannya 1/4.","v":"grid","n":4,"k":1},{"t":"Ada 6 kelereng. Setengahnya adalah ... kelereng.","a":["2","3","4"],"c":1,"e":"Bagi 6 menjadi 2 kelompok sama banyak: 6 ÷ 2 = 3.","v":"group","n":6,"k":2,"icon":"🔵"},{"t":"Ada 8 pensil. Seperempat dari 8 adalah ... pensil.","a":["2","4","6"],"c":0,"e":"Bagi 8 menjadi 4 kelompok sama banyak: 8 ÷ 4 = 2.","v":"group","n":8,"k":4,"icon":"✏️"},{"t":"Setengah dari 10 buah apel adalah ... buah.","a":["4","5","2"],"c":1,"e":"Setengah berarti dibagi 2 sama banyak. 10 ÷ 2 = 5.","v":"group","n":10,"k":2,"icon":"🍎"},{"t":"Seperempat dari 12 bunga adalah ... bunga.","a":["4","6","3"],"c":2,"e":"Seperempat berarti dibagi menjadi 4 kelompok sama banyak. 12 ÷ 4 = 3.","v":"group","n":12,"k":4,"icon":"🌼"},{"t":"Kue dipotong menjadi 4 bagian sama besar. Dua bagian yang diambil menunjukkan ...","a":["1/4","2/4","4/2"],"c":1,"e":"Dua bagian diambil dari total empat bagian, sehingga pecahannya 2/4.","v":"circle","n":4,"k":2},{"t":"Sebuah pita dibagi 2 bagian sama panjang. Kedua bagian diwarnai. Pecahan yang diwarnai adalah ...","a":["1/2","2/2","1/4"],"c":1,"e":"Kedua dari dua bagian diwarnai, jadi 2/2 atau satu utuh.","v":"bar","n":2,"k":2},{"t":"Batang dibagi 4 bagian sama besar dan 3 bagian diarsir. Pecahannya ...","a":["3/4","1/4","4/3"],"c":0,"e":"Pembilang adalah bagian diarsir (3), penyebut adalah seluruh bagian (4), jadi 3/4.","v":"bar","n":4,"k":3},{"t":"Ada 4 potong roti sama besar. Satu potong dimakan. Bagian yang tersisa adalah ...","a":["1/4","2/4","3/4"],"c":2,"e":"Dari 4 potong, 1 dimakan sehingga tersisa 3 potong. Bagian tersisa 3/4.","v":"bar","n":4,"k":3},{"t":"Sebuah lingkaran dibagi 4 bagian sama besar. Tiga bagian tidak diwarnai dan satu diwarnai. Bagian diwarnai adalah ...","a":["1/4","3/4","1/2"],"c":0,"e":"Satu dari empat bagian diwarnai, jadi 1/4.","v":"circle","n":4,"k":1},{"t":"Ada 4 anak berbagi 8 permen sama banyak. Setiap anak mendapat ... permen.","a":["1","2","4"],"c":1,"e":"8 permen dibagi kepada 4 anak: 8 ÷ 4 = 2 permen per anak.","v":"group","n":8,"k":4,"icon":"🍬"},{"t":"Setengah dari 14 kancing adalah ... kancing.","a":["6","7","8"],"c":1,"e":"Bagi 14 menjadi 2 kelompok sama banyak: 14 ÷ 2 = 7.","v":"group","n":14,"k":2,"icon":"🟣"},{"t":"Seperempat dari 16 ikan adalah ... ikan.","a":["2","8","4"],"c":2,"e":"Bagi 16 menjadi 4 kelompok sama banyak: 16 ÷ 4 = 4.","v":"group","n":16,"k":4,"icon":"🐟"},{"t":"Pecahan yang berarti satu dari dua bagian sama besar adalah ...","a":["1/4","1/2","2/1"],"c":1,"e":"Satu dari dua bagian sama besar ditulis 1/2.","v":"circle","n":2,"k":1},{"t":"Pecahan yang berarti satu dari empat bagian sama besar adalah ...","a":["1/3","1/2","1/4"],"c":2,"e":"Satu dari empat bagian sama besar ditulis 1/4.","v":"grid","n":4,"k":1},{"t":"Sebuah persegi panjang dibagi 2 bagian sama besar. Satu bagian diarsir. Pecahannya ...","a":["1/2","1/4","2/2"],"c":0,"e":"Satu dari dua bagian diarsir, jadi 1/2.","v":"bar","n":2,"k":1},{"t":"Dari 20 permen, seperempatnya dibagikan. Banyak permen yang dibagikan adalah ...","a":["10","5","4"],"c":1,"e":"Seperempat dari 20 berarti 20 ÷ 4 = 5 permen.","v":"group","n":20,"k":4,"icon":"🍬"},{"t":"Ada 18 buku. Setengahnya diletakkan di rak. Berapa buku yang diletakkan?","a":["9","6","3"],"c":0,"e":"Setengah dari 18 adalah 18 ÷ 2 = 9 buku.","v":"group","n":18,"k":2,"icon":"📚"},{"t":"Satu pizza dibagi 4 bagian sama besar. Dua bagian dimakan. Berapa bagian pizza yang dimakan?","a":["1/4","2/4","3/4"],"c":1,"e":"Dua bagian dari total empat bagian dimakan, jadi 2/4.","v":"circle","n":4,"k":2},{"t":"Gambar garis bilangan dari 0 sampai 1 dibagi menjadi 2 bagian sama. Titik tengah menunjukkan ...","a":["1/4","1/2","1"],"c":1,"e":"Titik tengah antara 0 dan 1 adalah 1/2.","v":"line","n":2,"k":1},{"t":"Garis bilangan dari 0 sampai 1 dibagi menjadi 4 bagian sama. Tanda pertama setelah 0 adalah ...","a":["1/2","1/3","1/4"],"c":2,"e":"Setiap langkah bernilai 1/4. Tanda pertama setelah 0 adalah 1/4.","v":"line","n":4,"k":1},{"t":"Pecahan 3/4 berarti ...","a":["3 bagian dari 4 bagian sama besar","4 bagian dari 3 bagian","1 bagian dari 3 bagian"],"c":0,"e":"Pembilang 3 menunjukkan bagian yang dihitung, penyebut 4 menunjukkan jumlah seluruh bagian sama besar.","v":"bar","n":4,"k":3},{"t":"Pecahan 2/2 menunjukkan ...","a":["Setengah benda","Seperempat benda","Satu benda utuh"],"c":2,"e":"Jika 2 dari 2 bagian diambil, seluruh bagian terambil. Jadi nilainya satu utuh.","v":"circle","n":2,"k":2},{"t":"Ada 24 kelereng dibagi sama banyak ke 4 kotak. Isi setiap kotak adalah ... kelereng.","a":["4","6","8"],"c":1,"e":"Bagi 24 kelereng ke 4 kelompok: 24 ÷ 4 = 6 kelereng setiap kotak.","v":"group","n":24,"k":4,"icon":"🔵"},{"t":"Ibu memiliki 12 jeruk. Setengah diberikan kepada tetangga. Jeruk yang diberikan berjumlah ...","a":["3","4","6"],"c":2,"e":"Setengah dari 12 adalah 12 ÷ 2 = 6 jeruk.","v":"group","n":12,"k":2,"icon":"🍊"}];
function svg(q){
 const ns='http://www.w3.org/2000/svg'; let s='<svg xmlns="'+ns+'" width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Ilustrasi soal pecahan">';
 const colors=['#ffca28','#66bb6a','#42a5f5','#ef5350'];
 if(q.v==='circle'){let n=q.n,k=q.k;for(let i=0;i<n;i++){let start=2*Math.PI*i/n-Math.PI/2,end=2*Math.PI*(i+1)/n-Math.PI/2,x1=160+43*Math.cos(start),y1=60+43*Math.sin(start),x2=160+43*Math.cos(end),y2=60+43*Math.sin(end),large=(end-start)>Math.PI?1:0;let d=n===2?(i===0?'M160 60 L160 17 A43 43 0 0 1 160 103 Z':'M160 60 L160 103 A43 43 0 0 1 160 17 Z'):`M160 60 L${x1} ${y1} A43 43 0 ${large} 1 ${x2} ${y2} Z`;s+='<path d="'+d+'" fill="'+(i<k?colors[i%4]:'#fff')+'" stroke="#455a64" stroke-width="2"/>';} }
 else if(q.v==='bar'){let n=q.n,k=q.k,w=240/n;for(let i=0;i<n;i++)s+='<rect x="'+(40+i*w)+'" y="35" width="'+w+'" height="50" fill="'+(i<k?colors[i%4]:'#fff')+'" stroke="#455a64" stroke-width="2"/>'; }
 else if(q.v==='grid'){let n=q.n;for(let i=0;i<n;i++)s+='<rect x="'+(112+(i%2)*48)+'" y="'+(20+Math.floor(i/2)*40)+'" width="48" height="40" fill="'+(i<q.k?colors[i%4]:'#fff')+'" stroke="#455a64" stroke-width="2"/>'; }
 else if(q.v==='fraction'){s+='<text x="160" y="48" text-anchor="middle" font-size="32" fill="#ad1457">'+q.k+'</text><line x1="137" y1="60" x2="183" y2="60" stroke="#263238" stroke-width="3"/><text x="160" y="94" text-anchor="middle" font-size="32" fill="#ad1457">'+q.n+'</text>'; }
 else if(q.v==='group'){let n=Math.min(q.n,24);for(let i=0;i<n;i++){let x=30+(i%8)*37,y=20+Math.floor(i/8)*32;s+='<circle cx="'+x+'" cy="'+y+'" r="12" fill="'+(i<Math.ceil(n/q.k)?colors[i%4]:'#e0e0e0')+'" stroke="#546e7a"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="13">'+(q.icon||'●')+'</text>'; }s+='<text x="160" y="112" text-anchor="middle" font-size="12" fill="#455a64">'+q.n+' benda dibagi '+q.k+' kelompok sama banyak</text>'; }
 else if(q.v==='line'){s+='<line x1="45" y1="62" x2="275" y2="62" stroke="#263238" stroke-width="3"/>';for(let i=0;i<=q.n;i++){let x=45+i*230/q.n;s+='<line x1="'+x+'" y1="50" x2="'+x+'" y2="74" stroke="#263238" stroke-width="2"/><text x="'+x+'" y="91" text-anchor="middle" font-size="12">'+(i===0?'0':i===q.n?'1':i+'/'+q.n)+'</text>';}}
 return s+'</svg>';
}
function render(){document.getElementById('quiz').innerHTML=questions.map((q,i)=>'<section class="q" id="q'+i+'"><div class="qno">Soal '+(i+1)+' dari 30</div><h3>'+q.t+'</h3><div class="visual">'+svg(q)+'</div><div class="opts">'+q.a.map((a,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'" onchange="updateProgress()"> <span><b>'+'ABC'[j]+'.</b> '+a+'</span></label>').join('')+'</div><div id="fb'+i+'" class="feedback"></div></section>').join('');updateProgress();}
function updateProgress(){let n=questions.filter((q,i)=>document.querySelector('input[name="q'+i+'"]:checked')).length;document.getElementById('progress').textContent=n+'/30 dijawab';}
function checkScore(){let correct=0,answered=0;questions.forEach((q,i)=>{let el=document.querySelector('input[name="q'+i+'"]:checked');if(el){answered++;if(+el.value===q.c)correct++;}});let score=Math.round(correct/30*100);let r=document.getElementById('result');r.className='feedback show';r.innerHTML='<b>Hasil: '+score+'/100</b><br>Jawaban benar: '+correct+' dari 30.<br>Terjawab: '+answered+' dari 30.';window.currentScore={correct,score,answered};}
function checkAnswers(){questions.forEach((q,i)=>{let el=document.querySelector('input[name="q'+i+'"]:checked');let f=document.getElementById('fb'+i);f.className='feedback show '+(el&&+el.value!==q.c?'bad':'');f.innerHTML='<b>Jawaban benar: '+('ABC'[q.c])+'. '+q.a[q.c]+'</b><br>'+q.e+(el?('<br><b>Jawabanmu:</b> '+('ABC'[+el.value])+'. '+q.a[+el.value]):'<br><i>Soal belum dijawab.</i>');});checkScore();}
function saveScore(){if(!window.currentScore)checkScore();let name=document.getElementById('student').value.trim()||'Tanpa nama';let record={name,score:window.currentScore.score,correct:window.currentScore.correct,date:new Date().toLocaleString('id-ID'),topic:'Bab 3 Latihan 2'};let arr=[];try{arr=JSON.parse(localStorage.getItem('kelas2-mtk-bab3-latihan2')||'[]')}catch(e){}arr.unshift(record);localStorage.setItem('kelas2-mtk-bab3-latihan2',JSON.stringify(arr.slice(0,100)));let r=document.getElementById('result');r.className='feedback show';r.innerHTML+=' <br><b>Nilai tersimpan di perangkat ini.</b>';}
function showHistory(){let arr=[];try{arr=JSON.parse(localStorage.getItem('kelas2-mtk-bab3-latihan2')||'[]')}catch(e){}let h=document.getElementById('history');h.className='feedback show';h.innerHTML='<b>Riwayat Nilai</b>'+(arr.length?arr.map(x=>'<div class="history-item">'+x.date+' — <b>'+escapeHtml(x.name)+'</b>: '+x.score+'/100 ('+x.correct+'/30 benar)</div>').join(''):'<p>Belum ada nilai tersimpan pada perangkat ini.</p>');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function resetQuiz(){if(confirm('Mulai ulang dan hapus jawaban saat ini?')){window.currentScore=null;render();document.getElementById('result').className='feedback';document.getElementById('history').className='feedback';window.scrollTo({top:0,behavior:'smooth'});}}
render();
</script></body></html>
