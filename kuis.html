<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuis Aku Tumbuh Besar - 40 Soal</title>
<style>
:root{--green:#176b4b;--green2:#238b63;--gold:#efbd45;--cream:#fff8e8;--ink:#18352a;--line:#dbe8df;--good:#dff5e6;--bad:#ffe7e3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef9f2,#fff9ec);color:var(--ink);line-height:1.55}.wrap{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,var(--green),#0e513a);color:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 10px 30px #174b3520}.hero h1{margin:5px 0;font-size:clamp(28px,5vw,42px)}.badge{display:inline-block;background:var(--gold);color:#3b2e0c;font-weight:800;padding:5px 12px;border-radius:999px}.sticky{position:sticky;top:0;z-index:5;background:#eef9f2ed;backdrop-filter:blur(8px);padding:10px 0}.progress{background:#fff;border-radius:16px;padding:12px 15px;box-shadow:0 4px 15px #00000010}.track{height:12px;background:#e8eee9;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:var(--gold);transition:.2s}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;border:1px solid #e4eee8;box-shadow:0 5px 18px #174b3510}.card h3{margin-top:0;color:var(--green)}.option{display:block;border:2px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0;cursor:pointer;background:#fff;transition:.15s}.option:hover{border-color:var(--green2);background:#f1faf4}.option input{margin-right:8px;accent-color:var(--green)}.actions{text-align:center;padding:10px 0 20px}button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:800;background:var(--green);color:#fff;cursor:pointer;margin:5px}button.alt{background:var(--gold);color:#3d3210}.result{display:none;background:#fff;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 6px 20px #0001}.score{font-size:48px;font-weight:900;color:var(--green);text-align:center}.msg{text-align:center;font-size:18px;font-weight:700}.review{margin-top:18px}.good,.bad{padding:10px 12px;border-radius:10px;margin:7px 0}.good{background:var(--good);border-left:5px solid #42a665}.bad{background:var(--bad);border-left:5px solid #c95b4d}.footer{text-align:center;color:#60776d;padding:20px;font-size:14px}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px}.hero{padding:22px 15px}.option{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><span class="badge">Bahasa Indonesia • Kelas IV SD</span><h1>🌱 Kuis “Aku Tumbuh Besar”</h1><p>40 soal pilihan ganda interaktif dari materi Bab 1. Pilih satu jawaban pada setiap soal, lalu tekan <b>Lihat Nilai</b>.</p></header>
<div class="sticky"><div class="progress"><b>Progress: <span id="pt">0/40</span></b><div class="track"><div class="bar" id="bar"></div></div></div></div>
<form id="quiz"></form>
<div class="actions"><button type="button" onclick="checkQuiz()">✅ Lihat Nilai</button><button type="button" class="alt" onclick="resetQuiz()">🔄 Ulangi Kuis</button></div>
<section class="result" id="result"><h2 style="text-align:center">Hasil Kuis</h2><div class="score" id="score"></div><div class="msg" id="msg"></div><div class="review" id="review"></div></section>
<div class="footer">Media pembelajaran Bab 1 “Aku Tumbuh Besar” • Kelas IV SD</div>
</div>
<script>
const data=[
['Tokoh dalam sebuah cerita adalah ....',['pelaku yang terdapat dalam cerita','tempat berlangsungnya cerita','pesan yang disampaikan cerita','judul yang diberikan pada cerita'],0],
['Tokoh dalam cerita dapat berupa ....',['manusia saja','hewan saja','manusia, hewan, atau benda','benda saja'],2],
['Konflik adalah ....',['permasalahan yang dialami tokoh','nama tempat dalam cerita','urutan halaman buku','judul sebuah cerita'],0],
['Konflik batin adalah permasalahan yang terjadi ....',['di luar lingkungan sekolah','di dalam diri seorang tokoh','hanya antara dua tokoh','di tempat tinggal tokoh'],1],
['Dalam contoh cerita tentang Beni, masalah yang dialami Beni adalah ....',['sepeda Beni hilang','baju olahraga Beni sudah kekecilan','Beni lupa membawa buku','Beni tidak memiliki sepatu'],1],
['Pertumbuhan terutama berkaitan dengan perubahan ....',['ukuran tubuh','nama seseorang','jumlah teman','hobi seseorang'],0],
['Contoh pertumbuhan manusia adalah ....',['tinggi dan berat badan bertambah','semakin pandai memilih teman','semakin matang mengendalikan emosi','semakin banyak pengalaman'],0],
['Perkembangan berkaitan dengan perubahan ....',['ukuran sepatu saja','kemampuan berpikir dan kematangan emosi','warna pakaian','jumlah makanan'],1],
['Salah satu faktor yang memengaruhi pertumbuhan adalah ....',['keturunan','pengalaman membaca saja','warna kesukaan','jumlah teman'],0],
['Salah satu faktor yang memengaruhi perkembangan adalah ....',['lingkungan','ukuran rumah','warna rambut saja','jenis sepatu'],0],
['Makna kata dapat dicari menggunakan ....',['KBBI','kalender','peta','kamus gambar saja'],0],
['Jika sebuah kata memiliki imbuhan, saat mencari maknanya kita dapat mencari ....',['kata dasarnya','huruf terakhirnya saja','jumlah suku katanya saja','judul babnya'],0],
['Verba adalah ....',['kata kerja','kata benda','kata sifat','kata bilangan'],0],
['Contoh verba adalah ....',['makan','buku','besar','rumah'],0],
['Nomina adalah ....',['kata kerja','kata benda','kata sifat','kata perintah'],1],
['Contoh nomina adalah ....',['mencicipi','pedas','buku','membaca'],2],
['Adjektiva adalah ....',['kata benda','kata kerja','kata sifat','kata bilangan'],2],
['Contoh adjektiva adalah ....',['besar','makan','sepatu','membaca'],0],
['Kata “ekspresi” bermakna ....',['pengungkapan perasaan atau pikiran','usaha untuk memulai sesuatu','mencoba rasa makanan','perubahan ukuran tubuh'],0],
['Kata “mencicipi” bermakna ....',['mencoba merasakan makanan atau minuman','mengungkapkan pikiran','melakukan usaha sendiri','mengubah ukuran tubuh'],0],
['Kata “berinisiatif” bermakna ....',['melakukan usaha sendiri untuk memulai sesuatu','mencoba merasakan makanan','mengungkapkan perasaan','menjadi lebih tinggi'],0],
['Kalimat transitif adalah kalimat yang predikatnya ....',['membutuhkan objek','tidak pernah memiliki subjek','selalu berupa kata sifat','tidak memiliki predikat'],0],
['Kalimat intransitif adalah kalimat yang predikatnya ....',['membutuhkan dua objek','tidak membutuhkan objek','selalu membutuhkan keterangan tempat','selalu berupa nomina'],1],
['Kalimat “Heri menggunakan sepatu baru.” termasuk kalimat ....',['transitif','intransitif','tanya','seru'],0],
['Pada kalimat “Heri menggunakan sepatu baru.”, objeknya adalah ....',['Heri','menggunakan','sepatu baru','baru'],2],
['Pada kalimat “Heri menggunakan sepatu baru.”, kata “Heri” berfungsi sebagai ....',['subjek','predikat','objek','keterangan'],0],
['Kalimat “Hani bersedih.” termasuk kalimat ....',['transitif','intransitif','majemuk','tanya'],1],
['Pada kalimat “Hani bersedih.”, kata “Hani” berfungsi sebagai ....',['subjek','predikat','objek','keterangan'],0],
['Cara cepat membedakan kalimat transitif adalah menanyakan ....',['melakukan apa atau siapa','di mana rumahnya','berapa umurnya','kapan bangun tidur'],0],
['Huruf tegak bersambung ditulis ....',['secara bersambung tanpa terputus','dengan setiap huruf terpisah jauh','hanya menggunakan huruf kapital','tanpa memperhatikan bentuk huruf'],0],
['Saat menulis huruf tegak bersambung, hal yang perlu diperhatikan adalah ....',['bentuk huruf dan kerapian','warna kertas saja','jumlah halaman saja','ukuran meja'],0],
['Huruf kapital digunakan pada ....',['awal kalimat dan nama orang','semua kata dalam kalimat','akhir setiap kata','kata yang terdiri dari dua suku kata saja'],0],
['Pada kalimat “Beni adalah anak yang baik.”, kata yang merupakan nama orang adalah ....',['Beni','adalah','anak','baik'],0],
['Nilai karakter yang sesuai dengan materi adalah ....',['suka membantu','suka mengejek','malas belajar','tidak peduli'],0],
['Anak yang mandiri berarti ....',['berusaha melakukan tugas sendiri','selalu meminta orang lain mengerjakan tugas','menghindari semua tugas','menunggu teman bekerja'],0],
['Sikap peduli ditunjukkan dengan ....',['memperhatikan teman yang kesulitan','menertawakan teman yang salah','mengabaikan keluarga','menolak membantu siapa pun'],0],
['Bertanggung jawab berarti ....',['menyelesaikan tugas dengan baik','meninggalkan tugas sebelum selesai','menyalahkan orang lain','menghindari kewajiban'],0],
['Dalam contoh materi, Citra memakan telur gulung. Kata “memakan” termasuk ....',['verba','nomina','adjektiva','kata bilangan'],0],
['Dalam contoh materi, “sepatu” termasuk kelas kata ....',['verba','nomina','adjektiva','kata sambung'],1],
['Pernyataan yang tepat tentang pertumbuhan dan perkembangan adalah ....',['pertumbuhan berkaitan dengan ukuran tubuh, perkembangan dengan kemampuan dan kematangan','pertumbuhan hanya berkaitan dengan emosi','perkembangan hanya berkaitan dengan tinggi badan','pertumbuhan dan perkembangan memiliki arti yang selalu sama'],0]
];
const form=document.getElementById('quiz');
data.forEach((item,i)=>{const card=document.createElement('section');card.className='card';let html='<h3>'+(i+1)+'. '+item[0]+'</h3>';item[1].forEach((op,j)=>{html+='<label class="option"><input type="radio" name="q'+i+'" value="'+j+'" onchange="progress()"><b>'+String.fromCharCode(65+j)+'.</b> '+op+'</label>'});card.innerHTML=html;form.appendChild(card)});
function progress(){let n=0;data.forEach((_,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++});document.getElementById('pt').textContent=n+'/40';document.getElementById('bar').style.width=(n/40*100)+'%'}
function checkQuiz(){let score=0,review='';data.forEach((item,i)=>{const el=document.querySelector('input[name="q'+i+'"]:checked');const chosen=el?Number(el.value):-1;if(chosen===item[2]){score++;review+='<div class="good"><b>'+(i+1)+'.</b> Benar: '+item[1][item[2]]+'</div>'}else{review+='<div class="bad"><b>'+(i+1)+'.</b> Jawabanmu: '+(chosen<0?'Belum dijawab':item[1][chosen])+'<br>Jawaban benar: <b>'+item[1][item[2]]+'</b></div>'}});const nilai=Math.round(score/40*100);document.getElementById('score').textContent=score+' / 40';document.getElementById('msg').textContent='Nilai: '+nilai+' — '+(nilai>=90?'🌟 Sangat baik!':nilai>=75?'👏 Bagus!':nilai>=60?'💪 Terus berlatih!':'📚 Pelajari kembali materinya, lalu coba lagi.');document.getElementById('review').innerHTML=review;document.getElementById('result').style.display='block';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function resetQuiz(){form.reset();document.getElementById('result').style.display='none';progress();window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body>
</html>
