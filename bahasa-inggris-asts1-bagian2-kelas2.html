<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTS 1 Bagian 2 — English Grade 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#e3f2fd);color:#263238}.top{background:linear-gradient(135deg,#1565c0,#2e7d32);color:#fff;text-align:center;padding:30px 15px}.wrap{max-width:900px;margin:auto;padding:18px 14px}.card,.q,.student,.result,.review{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.q h3{line-height:1.5}.opt{display:block;border:1px solid #d5dde5;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.opt:hover{background:#f1f8ff}.actions{position:sticky;bottom:0;background:#ffffffed;padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer;color:#fff}.check{background:#2e7d32}.corr{background:#1565c0}.save{background:#00897b}.reset{background:#6d4c41}.home{background:#fff;color:#1565c0;text-decoration:none;display:inline-block}.student input{width:100%;padding:11px;border:1px solid #ccd6df;border-radius:9px;font-size:16px}.ok,.bad{padding:12px;border-radius:10px;margin:9px 0}.ok{background:#edf8ef;border-left:5px solid #2e7d32}.bad{background:#fff1f1;border-left:5px solid #c62828}.solution{background:#e3f2fd;border-radius:9px;padding:11px;margin-top:8px;line-height:1.55}.saved{display:none;background:#e8f5e9;color:#1b5e20;padding:12px;border-radius:10px}.review{display:none}</style></head><body><header class="top"><h1>🇬🇧 ASTS 1 Bagian 2</h1><p>English — Grade 2 • The Zoo & Habitats</p><a class="btn home" href="bahasa-inggris-asts1-menu-kelas2.html">🏠 Menu Bahasa Inggris</a></header><main class="wrap"><section class="card"><b>Instructions:</b> Answer all 15 questions. Then choose <b>Periksa Nilai</b>. Use <b>Periksa Jawaban</b> to see the correct answer and the explanation for every question.</section><section class="student"><b>Student name</b><input id="nama" placeholder="Write student name"></section><div id="quiz"></div><div class="actions"><button class="btn check" onclick="check()">✅ Periksa Nilai</button><button class="btn corr" onclick="correction()">📝 Periksa Jawaban</button><button class="btn save" onclick="saveScore()">💾 Simpan Nilai</button><button class="btn reset" onclick="resetQuiz()">🔄 Ulangi</button></div><div id="saved" class="saved"></div><section id="result" class="result">Belum diperiksa.</section><section id="review" class="review"></section></main><script>const data=[{"q":"Which animal is shown as a zoo animal in Bab 2? ","o":["zebra","desk","hospital","train"],"a":0,"e":"The zoo picture labels animals such as zebra, polar bear, crocodile, tiger, monkey and parrot."},{"q":"Complete: 'Penny likes fish. She doesn't like ...'","o":["fish","cheese","water","polar bears"],"a":1,"e":"The Language focus in Bab 2 contrasts 'likes fish' with 'doesn't like cheese'."},{"q":"Choose the correct sentence. ","o":["She don't like peas.","She doesn't like peas.","She doesn't likes peas.","She not like peas."],"a":1,"e":"With 'she', the negative present simple uses 'doesn't + base verb': She doesn't like peas."},{"q":"What question asks about a girl's preference? ","o":["Does Penny like crocodiles?","Is Penny crocodiles?","Has Penny like crocodiles?","Do Penny likes crocodiles?"],"a":0,"e":"The material uses the question pattern 'Does Penny like ...?'"},{"q":"What is a habitat? ","o":["A home for plants and animals.","A school subject.","A type of clock.","A classroom object."],"a":0,"e":"Bab 2 explains that a habitat is a home for plants and animals."},{"q":"Which habitat is associated with zebras in the table? ","o":["grassland","ocean","polar habitat","hospital"],"a":0,"e":"The habitat table places zebra in grassland."},{"q":"Which animal is shown living in the ocean? ","o":["fish","polar bear","zebra","monkey"],"a":0,"e":"The habitat table shows fish in ocean habitats."},{"q":"Which animals are shown in rainforest habitats? ","o":["monkey and parrot","polar bear and fish","zebra and polar bear","tiger and polar bear"],"a":0,"e":"The habitat section identifies rainforest animals including monkeys and parrots."},{"q":"Read the sentence: 'My favourite animal is very big. It likes meat, but it doesn't like water.' Which fact is true? ","o":["The animal likes water.","The animal is very big.","The animal doesn't like meat.","The animal is small."],"a":1,"e":"The sentence directly says the favourite animal is very big."},{"q":"In 'The zoo keeper', what does Misty help find? ","o":["a key","a book","a clock","a pencil"],"a":0,"e":"In the story, the zoo keeper says 'my keys' and Misty says she can help."},{"q":"What does the zoo keeper lose? ","o":["his keys","his animals","his computer","his hat"],"a":0,"e":"The story repeatedly refers to the zoo keeper's keys."},{"q":"Which sentence is correct? ","o":["Crocodiles like water.","Crocodiles likes water.","Crocodile like waters.","Crocodiles liking water."],"a":0,"e":"The plural subject 'crocodiles' takes the base verb: Crocodiles like water."},{"q":"Which animal is connected with a polar habitat? ","o":["polar bear","parrot","monkey","zebra"],"a":0,"e":"The habitat table places the polar bear in a polar habitat."},{"q":"Which question is correct for asking whether Ryan likes snakes? ","o":["Does Ryan like snakes?","Do Ryan likes snakes?","Is Ryan like snakes?","Ryan does like snakes?"],"a":0,"e":"For a singular name, use 'Does + subject + base verb': Does Ryan like snakes?"},{"q":"Which sentence follows the pattern used in Bab 2? ","o":["Yes, he does.","Yes, he do.","Yes, he is.","Yes, he likes."],"a":0,"e":"Short answers to 'Does ...?' use 'Yes, he does.'"}];let last=null;function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function render(){quiz.innerHTML=data.map((x,i)=>'<section class="q"><h3>'+(i+1)+'. '+esc(x.q)+'</h3>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</section>').join('')}function sel(i){const x=document.querySelector('input[name="q'+i+'"]:checked');return x===null?null:+x.value}function check(){let b=0,d=0;data.forEach((x,i)=>{const s=sel(i);if(s!==null)d++;if(s===x.a)b++});last={b,d,n:data.length,nilai:Math.round(b/data.length*100)};result.innerHTML='<h2>📊 Hasil</h2><div style="font-size:42px;font-weight:900;color:#2e7d32">'+last.nilai+'</div><p>Benar <b>'+last.b+'</b> dari '+last.n+' soal. Dijawab: <b>'+last.d+'</b>.</p>'}function correction(){if(!last)check();let h='<h2>📝 Koreksi Jawaban & Cara Mengerjakan</h2>';data.forEach((x,i)=>{const s=sel(i),ok=s===x.a;h+='<div class="'+(ok?'ok':'bad')+'"><b>Soal '+(i+1)+' — '+(ok?'Benar':'Perlu diperbaiki')+'</b><br>Jawaban kamu: <b>'+esc(s===null?'Belum dijawab':x.o[s])+'</b><br>Jawaban benar: <b>'+esc(x.o[x.a])+'</b><div class="solution"><b>📌 Cara mengerjakan:</b><br>'+esc(x.e)+'</div></div>'});review.innerHTML=h;review.style.display='block';review.scrollIntoView({behavior:'smooth'})}function saveScore(){if(!last)check();const nama=(document.getElementById('nama').value||'Siswa').trim();const key='nilai-asts1-english-grade2-bag'+2;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({nama,nilai:last.nilai,benar:last.b,total:last.n,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(key,JSON.stringify(arr.slice(0,50)));saved.textContent='✅ Nilai tersimpan untuk '+nama+': '+last.nilai+' ('+last.b+'/'+last.n+').';saved.style.display='block'}function resetQuiz(){render();last=null;result.textContent='Belum diperiksa.';review.style.display='none';saved.style.display='none';scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
