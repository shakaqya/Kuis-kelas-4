<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelas 2 (Qya) — PAI Asmaul Husna</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3ff;color:#263238}header{background:linear-gradient(135deg,#283593,#1565c0);color:#fff;text-align:center;padding:28px 15px}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #0002}.menu{display:flex;gap:8px;flex-wrap:wrap}.menu button{flex:1;min-width:150px;padding:13px;border:0;border-radius:12px;background:#e8eaf6;color:#283593;font-weight:bold;cursor:pointer}.menu button.active{background:#3949ab;color:#fff}.sec{display:none}.sec.active{display:block}.slide{display:none;min-height:230px;align-items:center;gap:22px}.slide.active{display:flex}.icon{font-size:75px;background:#f1f3ff;border-radius:20px;padding:25px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{padding:9px 12px;border:0;border-radius:20px;background:#e8eaf6;color:#283593;font-weight:bold}.tab.active{background:#3949ab;color:#fff}button{cursor:pointer}.listen{background:#1565c0;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}.nav{display:flex;justify-content:space-between;margin-top:15px}.q{padding:18px 0;border-top:1px solid #ddd}.choice{display:flex;gap:9px;padding:12px;border:2px solid #ddd;border-radius:10px;margin:7px 0}.choice.correct{background:#c8e6c9;border-color:#2e7d32}.choice.wrong{background:#ffcdd2;border-color:#c62828}.mark{margin-left:auto;font-weight:bold}.feedback{font-weight:bold;margin-top:8px}.submit{width:100%;padding:15px;background:#2e7d32;color:#fff;border:0;border-radius:11px;font-size:17px;font-weight:bold}.result{display:none;background:#f1f8e9;border:2px solid #81c784}.score{font-size:52px;font-weight:bold;color:#2e7d32;text-align:center}@media(max-width:600px){.slide.active{flex-direction:column;text-align:center}.icon{font-size:55px}}</style></head><body><header><h1>📚 Kelas 2 (Qya)</h1><p>PAI — Asmaul Husna</p></header><div class="wrap"><div class="card"><div class="menu"><button class="active" onclick="show('materi',this)">🎬 Materi</button><button onclick="show('quiz1',this)">📝 Quiz 1 — 25 Soal</button><button onclick="show('quiz2',this)">📝 Quiz 2 — 30 Soal</button></div></div><section id="materi" class="sec active"><div class="card"><h2>🎬 Materi Audio Visual</h2><div class="tabs"><button class="tab active" onclick="slideTo(0)">Pembuka</button><button class="tab" onclick="slideTo(1)">Al-Ghani</button><button class="tab" onclick="slideTo(2)">Al-Wadud</button><button class="tab" onclick="slideTo(3)">Al-Hadi</button><button class="tab" onclick="slideTo(4)">Al-Hafizh</button><button class="tab" onclick="slideTo(5)">Al-Ahad</button><button class="tab" onclick="slideTo(6)">Ash-Shamad</button><button class="tab" onclick="slideTo(7)">Al-Hasib</button><button class="tab" onclick="slideTo(8)">Rangkuman</button></div>__SLIDES__<div class="nav"><button onclick="slideTo(cur-1)">← Sebelumnya</button><span id="counter">1 / 9</span><button onclick="slideTo(cur+1)">Berikutnya →</button></div></div></section><section id="quiz1" class="sec"><div class="card"><h2>📝 Quiz 1 — 25 Soal</h2><p>Kerjakan lalu tekan Periksa Jawaban.</p><form id="f1">__Q1__<button class="submit">🔎 PERIKSA JAWABAN QUIZ 1</button></form></div><div id="r1" class="card result"><h2>🎉 Hasil Quiz 1</h2><div id="s1" class="score"></div><div id="m1"></div><div id="v1"></div></div></section><section id="quiz2" class="sec"><div class="card"><h2>📝 Quiz 2 — 30 Soal</h2><p>Kerjakan lalu tekan Periksa Jawaban.</p><form id="f2">__Q2__<button class="submit">🔎 PERIKSA JAWABAN QUIZ 2</button></form></div><div id="r2" class="card result"><h2>🎉 Hasil Quiz 2</h2><div id="s2" class="score"></div><div id="m2"></div><div id="v2"></div></div></section></div><script>const texts=__TEXTS__;let cur=0,utt;function show(id,b){document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function speak(n){if(!('speechSynthesis'in window)){alert('Gunakan Chrome atau Safari terbaru.');return}speechSynthesis.cancel();utt=new SpeechSynthesisUtterance(texts[n]);utt.lang='id-ID';utt.rate=.88;utt.pitch=1;utt.volume=1;let vs=speechSynthesis.getVoices();let v=vs.find(x=>/^id(-|_)/i.test(x.lang)||/indones/i.test(x.name));if(v)utt.voice=v;speechSynthesis.speak(utt)}function slideTo(n){if(n<0||n>8)return;cur=n;document.querySelectorAll('.slide').forEach((x,i)=>x.classList.toggle('active',i===n));document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===n));document.getElementById('counter').textContent=(n+1)+' / 9';setTimeout(()=>speak(n),100)}function grade(form,id,keys,exps){let f=document.getElementById(form),correct=0,empty=0;f.querySelectorAll('.feedback,.mark').forEach(x=>x.remove());keys.forEach((k,i)=>{let q=document.getElementById('q'+(form==='f1'?i:i+25));if(!q)return;let o=q.querySelectorAll('.choice'),p=q.querySelector('input:checked');o[k].classList.add('correct');o[k].insertAdjacentHTML('beforeend','<span class="mark">✓ Benar</span>');let z=document.createElement('div');z.className='feedback';if(!p){empty++;z.textContent='⚠️ Belum dijawab.';z.style.color='#e65100'}else if(+p.value===k){correct++;z.textContent='✅ BENAR — '+exps[i];z.style.color='#2e7d32'}else{p.closest('.choice').classList.add('wrong');p.closest('.choice').insertAdjacentHTML('beforeend','<span class="mark">✗ Pilihanmu</span>');z.textContent='❌ SALAH — '+exps[i];z.style.color='#c62828'}q.appendChild(z)});let score=Math.round(correct/keys.length*100);document.getElementById(id[0]).textContent=score+' / 100';document.getElementById(id[1]).innerHTML='<b>'+correct+' dari '+keys.length+' benar.</b>'+(empty?' <br>⚠️ '+empty+' belum dijawab.':'');document.getElementById(id[2]).innerHTML='<h3>📌 Kunci & Pembahasan</h3>';keys.forEach((k,i)=>{let q=document.getElementById('q'+(form==='f1'?i:i+25)),a=q.querySelectorAll('.choice')[k],d=document.createElement('div');d.className='q';d.innerHTML='<b>Soal '+(i+1)+'</b><br>🟢 '+a.innerText+'<br>'+exps[i];document.getElementById(id[2]).appendChild(d)});document.getElementById(id[3]).style.display='block';document.getElementById(id[3]).scrollIntoView({behavior:'smooth'})}document.getElementById('f1').onsubmit=e=>{e.preventDefault();grade('f1',['s1','m1','v1','r1'],__K1__,__E1__)};document.getElementById('f2').onsubmit=e=>{e.preventDefault();grade('f2',['s2','m2','v2','r2'],__K2__,__E2__)};speechSynthesis&&speechSynthesis.addEventListener('voiceschanged',()=>{});slideTo(0);</script></body></html>
