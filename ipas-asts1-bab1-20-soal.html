<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTS 1 Bab 1 — Perubahan Energi</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#fff8e1);color:#263238}
.top{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;text-align:center;padding:30px 16px}
.top h1{margin:8px 0;font-size:clamp(26px,6vw,42px)}.wrap{max-width:950px;margin:auto;padding:20px 14px}
.panel,.q{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #0002}
input[type=text]{width:100%;padding:12px;border:1px solid #cfd8dc;border-radius:10px;font-size:16px}
.q h3{margin-top:0}.opt{display:block;padding:11px;border:1px solid #dce3e6;border-radius:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#f1f8e9}
.actions{display:flex;gap:9px;flex-wrap:wrap;position:sticky;bottom:8px;background:#ffffffee;padding:10px;border-radius:14px;box-shadow:0 3px 14px #0002}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.check{background:#2e7d32;color:#fff}.review{background:#1565c0;color:#fff}.save{background:#ef6c00;color:#fff}.reset{background:#6d4c41;color:#fff}
.result{padding:15px;border-radius:12px;background:#e8f5e9;margin-top:12px}.wrong{background:#ffebee}.correct{background:#e8f5e9}.explain{display:none;background:#fff8e1;border-left:4px solid #ef6c00;padding:12px;margin-top:10px;border-radius:8px}.show{display:block}
.home{display:inline-block;text-decoration:none;background:#fff;color:#2e7d32;padding:9px 14px;border-radius:9px;font-weight:800}.progress{font-weight:800;color:#546e7a}
</style></head><body>
<header class="top"><div>🌿 IPAS • KELAS 4 • ASTS 1</div><h1>ASTS 1 Bab 1 — Perubahan Energi</h1><p>20 soal berdasarkan materi Perubahan (Transformasi) Bentuk Energi, Fotosintesis, dan Energi Listrik.</p><a class="home" href="ipas-menu.html?v=20260923">🏠 Kembali ke Menu IPAS</a></header>
<main class="wrap"><section class="panel"><label><b>Nama siswa</b><input id="nama" type="text" placeholder="Tulis nama siswa"></label><p class="progress">📝 20 soal • Pilih jawaban yang paling tepat. Untuk soal bertanda <b>(PGK)</b>, boleh memilih lebih dari satu.</p><div id="result"></div></section><form id="quiz"></form>
<div class="actions"><button class="check" id="checkBtn" type="button">📊 Periksa Nilai</button><button class="review" id="reviewBtn" type="button">📝 Periksa Jawaban</button><button class="save" id="saveBtn" type="button">💾 Simpan Nilai</button><button class="reset" id="resetBtn" type="button">🔄 Ulangi</button></div></main>
<script>
const data=[{"q":"Energi listrik pada setrika terutama berubah menjadi energi …","o":["cahaya","panas","gerak","kimia"],"a":1,"e":"Setrika menggunakan energi listrik untuk menghasilkan panas sehingga pakaian menjadi rapi."},{"q":"Perubahan energi pada kompor gas saat digunakan untuk memasak adalah …","o":["kimia menjadi panas","panas menjadi listrik","gerak menjadi cahaya","cahaya menjadi kimia"],"a":0,"e":"Energi kimia yang tersimpan dalam gas berubah menjadi energi panas saat dibakar."},{"q":"Matahari merupakan sumber energi utama yang membantu tumbuhan membuat makanan melalui …","o":["respirasi","fotosintesis","penguapan","pembakaran"],"a":1,"e":"Fotosintesis menggunakan cahaya matahari untuk membantu tumbuhan menghasilkan glukosa."},{"q":"Bagian daun yang mengandung klorofil dan berperan menangkap energi cahaya adalah …","o":["akar","kloroplas","batang","bunga"],"a":1,"e":"Klorofil berada di dalam kloroplas dan menyerap energi cahaya untuk fotosintesis."},{"q":"Bahan yang dibutuhkan tumbuhan dalam proses fotosintesis adalah … (PGK)","o":["air","karbon dioksida","oksigen","cahaya matahari"],"a":[0,1,3],"e":"Materi menjelaskan bahwa fotosintesis memerlukan air, karbon dioksida, dan cahaya matahari; oksigen merupakan salah satu hasilnya."},{"q":"Hasil fotosintesis yang menjadi makanan bagi tumbuhan adalah …","o":["glukosa/karbohidrat","oksigen saja","air","mineral"],"a":0,"e":"Fotosintesis menghasilkan glukosa atau karbohidrat yang menjadi sumber makanan tumbuhan."},{"q":"Salah satu hasil fotosintesis yang dilepaskan ke udara adalah …","o":["oksigen","minyak","garam","nitrogen"],"a":0,"e":"Oksigen dihasilkan dalam proses fotosintesis dan dilepaskan melalui stomata."},{"q":"Jika tumbuhan kekurangan cahaya matahari, proses fotosintesis cenderung …","o":["berlangsung maksimal","berkurang","berubah menjadi pembakaran","menghasilkan lebih banyak makanan"],"a":1,"e":"Materi menunjukkan tumbuhan yang kekurangan cahaya menghasilkan makanan lebih sedikit karena fotosintesis tidak maksimal."},{"q":"Transformasi energi pada kipas angin adalah …","o":["listrik menjadi gerak","gerak menjadi listrik","panas menjadi kimia","cahaya menjadi gerak"],"a":0,"e":"Energi listrik menggerakkan motor kipas sehingga baling-baling berputar."},{"q":"Transformasi energi pada radio ketika digunakan untuk mendengarkan suara adalah …","o":["listrik menjadi bunyi","bunyi menjadi listrik","panas menjadi cahaya","kimia menjadi gerak"],"a":0,"e":"Radio menggunakan energi listrik dan mengubahnya menjadi energi bunyi yang dapat didengar."},{"q":"Pembangkit Listrik Tenaga Uap (PLTU) memanfaatkan … untuk menghasilkan listrik.","o":["tenaga uap untuk memutar turbin","cahaya bulan","gaya magnet saja","air laut tanpa turbin"],"a":0,"e":"Pada PLTU, energi panas menghasilkan uap yang digunakan untuk memutar turbin dan menggerakkan generator."},{"q":"Pada PLTA, aliran air digunakan untuk …","o":["memutar turbin","membakar bahan bakar","menghasilkan cahaya langsung","menghentikan generator"],"a":0,"e":"Air yang mengalir atau jatuh digunakan untuk menggerakkan turbin, lalu generator menghasilkan listrik."},{"q":"PLTB memanfaatkan energi …","o":["angin","batu bara","minyak bumi","matahari"],"a":0,"e":"PLTB adalah Pembangkit Listrik Tenaga Bayu yang memanfaatkan energi angin untuk memutar turbin."},{"q":"PLTS menggunakan energi … untuk menghasilkan listrik.","o":["matahari","air","uap","batu bara"],"a":0,"e":"Panel surya pada PLTS menyerap energi cahaya matahari dan mengubahnya menjadi energi listrik."},{"q":"Generator pada pembangkit listrik berfungsi mengubah energi … menjadi energi listrik.","o":["mekanik/gerak","cahaya","bunyi","kimia makanan"],"a":0,"e":"Generator mengubah energi gerak atau mekanik menjadi energi listrik."},{"q":"Manakah contoh penggunaan energi listrik yang tepat dalam kehidupan sehari-hari? (PGK)","o":["menyalakan lampu","menyalakan kipas angin","menggunakan setrika","menjemur pakaian dengan matahari"],"a":[0,1,2],"e":"Lampu, kipas, dan setrika menggunakan energi listrik. Menjemur pakaian memanfaatkan energi matahari."},{"q":"Perubahan energi pada blender ketika digunakan adalah …","o":["listrik menjadi gerak","gerak menjadi listrik","cahaya menjadi kimia","panas menjadi cahaya"],"a":0,"e":"Motor blender mengubah energi listrik menjadi energi gerak pada pisau blender."},{"q":"Daun menjadi tempat utama pembuatan makanan karena …","o":["mengandung klorofil","tidak membutuhkan cahaya","menyimpan semua air","menghasilkan tanah"],"a":0,"e":"Daun mengandung klorofil yang menangkap cahaya matahari untuk fotosintesis."},{"q":"Menurut materi, energi memiliki sifat bahwa energi …","o":["dapat diciptakan sesuka hati","dapat diubah dari satu bentuk ke bentuk lain","selalu hilang","hanya berbentuk listrik"],"a":1,"e":"Rangkuman menyatakan energi tidak diciptakan atau dimusnahkan, tetapi dapat berubah dari satu bentuk menjadi bentuk lain."},{"q":"Urutan yang tepat pada pembangkit listrik tenaga air adalah …","o":["air menggerakkan turbin → turbin menggerakkan generator → menghasilkan listrik","air menjadi listrik langsung tanpa alat","generator membakar air → listrik","panel surya memutar turbin air"],"a":0,"e":"Pada PLTA, aliran air menggerakkan turbin. Turbin memutar generator sehingga energi listrik dihasilkan."}];
const histKey='nilai-asts1-ipas-kelas4';
let checked=false,lastScore=null;
function render(){document.getElementById('quiz').innerHTML=data.map((q,i)=>{
 const multi=Array.isArray(q.a);
 return '<section class="q" id="q'+i+'"><h3>'+ (i+1)+'. '+q.q+'</h3>'+
 q.o.map((o,j)=>'<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+
 '<div class="explain" id="e'+i+'"><b>Jawaban benar:</b> '+q.a.map?(()=>{const a=Array.isArray(q.a)?q.a:[q.a];return a.map(x=>String.fromCharCode(65+x)+'. '+q.o[x]).join(', ')})():String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'<br><b>Cara mengerjakan:</b> '+q.e+'</div></section>';
}).join('')}
function getAns(i){return [...document.querySelectorAll('[name="q'+i+'"]:checked')].map(x=>+x.value).sort((a,b)=>a-b)}
function same(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function calc(){let score=0;data.forEach((q,i)=>{let u=getAns(i),a=(Array.isArray(q.a)?q.a:[q.a]).slice().sort((x,y)=>x-y);if(same(u,a))score++});return score}
function periksa(){const s=calc();lastScore=s;checked=true;document.getElementById('result').innerHTML='<div class="result"><h2>Nilai: '+Math.round(s/data.length*100)+'</h2><p>Benar <b>'+s+'</b> dari '+data.length+' soal.</p></div>';data.forEach((q,i)=>{document.getElementById('q'+i).classList.toggle('correct',same(getAns(i),(Array.isArray(q.a)?q.a:[q.a]).slice().sort((a,b)=>a-b)));});}
function koreksi(){data.forEach((q,i)=>document.getElementById('e'+i).classList.add('show'));if(!checked)periksa();document.getElementById('result').innerHTML+='<div class="result">📝 Pembahasan setiap soal sudah ditampilkan.</div>'}
function simpan(){if(!checked)periksa();const nama=document.getElementById('nama').value.trim();if(!nama){alert('Isi nama siswa terlebih dahulu.');return}const arr=JSON.parse(localStorage.getItem(histKey)||'[]');arr.unshift({nama,title:"ASTS 1 Bab 1 — Perubahan Energi",nilai:Math.round(lastScore/data.length*100),benar:lastScore,total:data.length,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(histKey,JSON.stringify(arr.slice(0,30)));alert('Nilai berhasil disimpan.');}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('.explain').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.q').forEach(x=>x.classList.remove('correct','wrong'));document.getElementById('result').innerHTML='';checked=false;lastScore=null;window.scrollTo({top:0,behavior:'smooth'})}
function init(){render();document.getElementById('checkBtn').onclick=periksa;document.getElementById('reviewBtn').onclick=koreksi;document.getElementById('saveBtn').onclick=simpan;document.getElementById('resetBtn').onclick=resetQuiz}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
</script></body></html>
