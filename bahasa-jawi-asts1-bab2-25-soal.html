<header class="top"><div>📚 BAHASA JAWI • KELAS 4 • ASTS 1</div><h1>ASTS 1 Bab 2 — Tembang Gambuh</h1><p>25 soal berdasarkan Pasinaon 2: Tembang Gambuh, guru gatra, guru wilangan, guru lagu, isi, piweling, dan nyritakake tembang.</p><a class="home" href="bahasa-jawi-menu.html?v=20260923">🏠 Kembali ke Menu Bahasa Jawi</a></header>

<script>
const data=[{"q":"Tembang Gambuh kalebu jinis sastra ...","o":["Jawa","Indonesia","Madura","Sunda"],"a":0,"e":"Pasinaon 2 nerangake Tembang Gambuh minangka salah sawijining sastra Jawa."},{"q":"Tembang Gambuh kalebu tembang ...","o":["macapat","dolanan","campursari","modern"],"a":0,"e":"Ing ringkesan kaca 22, Tembang Gambuh kasebut minangka sastra jinis geguritan gagrak lawas lan kalebu tembang macapat."},{"q":"Ciri utama tembang macapat yaiku nduweni aturan tartamtu ing ...","o":["guru gatra, guru wilangan, lan guru lagu","warna, gambar, lan judhul","tokoh, alur, lan latar","ukuran buku lan kaca"],"a":0,"e":"Ringkesan Pasinaon 2 nyebut aturan tembang macapat yaiku guru gatra, guru wilangan, lan guru lagu."},{"q":"Guru gatra yaiku ...","o":["cacahing wanda ing saben gatra","cacahing gatra utawa larik ing saben pada","swara pungkasan","jeneng tembang"],"a":1,"e":"Materi nerangake guru gatra minangka cacahing gatra utawa larik ing saben pada."},{"q":"Guru wilangan yaiku ...","o":["cacahing wanda ing saben gatra","cacahing pada","swara pungkasan","isi pitutur"],"a":0,"e":"Guru wilangan yaiku cacahing wanda utawa suku kata ing saben gatra."},{"q":"Guru lagu yaiku ...","o":["cacahing wanda","cacahing larik","cacahing swara utawa vokal ing pungkasane gatra","judul tembang"],"a":2,"e":"Ringkesan nerangake guru lagu minangka cacahing swara/vokal ing pungkasane gatra utawa larik."},{"q":"Saben pada Tembang Gambuh ing materi nduweni ... gatra.","o":["5","6","7","8"],"a":0,"e":"Tabel guru gatra ing kaca 15 nuduhake Tembang Gambuh nduweni 5 gatra saben pada."},{"q":"Guru wilangan lan guru lagu pada 1 Tembang Gambuh yaiku ...","o":["7u, 10u, 12i, 8u, 8o","5a, 5i, 5u, 5a, 5i","10u, 10a, 10i, 10u, 10o","8a, 8i, 8u, 8a, 8i"],"a":0,"e":"Tabel kaca 15 menehi pola pada 1: 7u, 10u, 12i, 8u, 8o."},{"q":"Guru wilangan lan guru lagu pada 2 yaiku ...","o":["7u, 10u, 12i, 8u, 8o","8a, 8i, 8u, 8a, 8i","7a, 10i, 12u, 8a, 8i","5u, 5u, 5i, 5u, 5o"],"a":0,"e":"Tabel ing kaca 15 nuduhake pola sing padha kanggo pada 2: 7u, 10u, 12i, 8u, 8o."},{"q":"Tembang \"Sekar Gambuh Ping Catur\" minangka tuladha tembang ...","o":["Gambuh","Pangkur","Kinanthi","Sinom"],"a":0,"e":"Judhul tembang ing materi yaiku \"Sekar Gambuh Ping Catur\"."},{"q":"Ukara \"Sekar gambuh ping catur\" nuduhake yen tembang kasebut ...","o":["kalebu tembang Gambuh kaping papat","ora kalebu tembang macapat","tembang dolanan","tembang anyar"],"a":0,"e":"\"Ping catur\" tegese kaping papat, lan judhulé nyebut Sekar Gambuh."},{"q":"Isi pitutur ing \"Sekar Gambuh Ping Catur\" akeh gegayutane karo ...","o":["kejujuran lan tumindak becik","adol tuku","permainan","perjalanan"],"a":0,"e":"Latihan isi tembang ing kaca 18-19 njaluk siswa mangerteni pitutur babagan tumindak, kejujuran, lan prilaku becik."},{"q":"Ukara \"kabeh kudu dilakoni\" ing konteks pitutur tembang ngajari supaya ...","o":["tumindak kanthi bener","ora gelem sinau","seneng padu","ora ngrungokake nasihat"],"a":0,"e":"Pitutur tembang digunakake kanggo menehi tuntunan tumindak sing becik lan bener."},{"q":"Ing Wulangan 2, siswa dilatih nemokake informasi kanthi njawab ...","o":["pitakon babagan isi Tembang Gambuh","pitakon matematika","pitakon olahraga","pitakon peta"],"a":0,"e":"Wulangan 2 kanthi irah-irahan \"Isine Tembang Gambuh\" fokus nggoleki isi lan informasi saka tembang."},{"q":"Sawise maca tembang, siswa bisa nulis isine Tembang Gambuh ing ...","o":["ragam krama","ragam ngoko lan krama","basa Inggris","angka"],"a":1,"e":"Kaca 16-18 menehi latihan nulis isi tembang ing ragam krama lan mbandhingake ukara ngoko-krama."},{"q":"Ing Wulangan 3, kegiatan utama yaiku ...","o":["piweling lan nyritakake tembang Gambuh","nggambar pemandangan","ngitung guru wilangan wae","dolanan"],"a":0,"e":"Wulangan 3 nduweni judhul \"Piweling lan Nyritakake Tembang Gambuh\"."},{"q":"Piweling saka tembang kudu dituduhake kanthi ...","o":["ngganti makna tembang","nerangake pesen utawa nasihat sing ana ing tembang","mung maca judhul","ngilangi pada"],"a":1,"e":"Kegiatan piweling njaluk siswa ngenali pesen/nasihat saka isi tembang."},{"q":"Nalika nyritakake isi tembang, guru menehi arahan supaya crita ...","o":["runtut, ganep, lan basamu kudu trep","mung siji ukara","ora runtut","nggunakake basa apa wae tanpa konteks"],"a":0,"e":"Pangeling-eling ing kaca 21 nyebut nyritakake isi kudu runtut, ganep, lan basamu kudu trep."},{"q":"Tembung \"pada\" ing konteks tembang nuduhake ...","o":["bait","orang","pasar","guru"],"a":0,"e":"Ing materi tembang, \"pada\" digunakake kanggo bagean utawa bait tembang."},{"q":"Tembung \"gatra\" gegayutan karo ...","o":["larik/baris ing tembang","jeneng wong","panganan","alat musik"],"a":0,"e":"Guru gatra gegayutan karo cacahing gatra utawa larik ing saben pada."},{"q":"Ing latihan Pasinaon 2, siswa kudu bisa nemtokake guru gatra Tembang Gambuh yaiku ...","o":["5","7","8","10"],"a":0,"e":"Latihan kaca 22 lan tabel kaca 15 nuduhake guru gatra Tembang Gambuh ana 5."},{"q":"Ing soal latihan, \"Tibane swara ing pungkasane gatra\" gegayutan karo ...","o":["guru lagu","guru gatra","guru wilangan","pitutur"],"a":0,"e":"Guru lagu yaiku swara utawa vokal ing pungkasane gatra."},{"q":"Yen tembang duwe guru wilangan 7 lan guru lagu u, notasi gatrane ditulis ...","o":["7u","u7","7a","8u"],"a":0,"e":"Ing tabel materi, guru wilangan ditulis minangka angka lan guru lagu minangka huruf swara pungkasan, contone 7u."},{"q":"Ing AKM Pasinaon 2, tembung sing paling trep kanggo \"Tembung Tembang\" ing dhuwur pada gegayutan karo ...","o":["kumpulan ukara tembang","jeneng sekolah","gambar","angka"],"a":0,"e":"Latihan AKM adhedhasar struktur tembang lan isi wacan, mula tembung/pada gegayutan karo kumpulan larik utawa ukara ing tembang."},{"q":"Kegiatan pungkasan Pasinaon 2 yaiku pameran seni tradisional wujud teks ...","o":["Tembang Gambuh","surat pribadi","iklan","cerita rakyat"],"a":0,"e":"Kaca 25 nduweni kegiatan \"Pameran Wacan Tembang Gambuh\" lan siswa nyusun teks tembang ing kertas warna."}];const histKey='nilai-asts1-bahasa-jawi-kelas4';let checked=false,lastScore=0;
function render(){document.getElementById('quiz').innerHTML=data.map((q,i)=>{const a=Array.isArray(q.a)?q.a:[q.a];const multi=a.length>1;return '<section class="q" id="q'+i+'"><div class="tag">'+(multi?'PGK — pilih semua yang benar':'Pilihan Ganda')+'</div><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map((o,j)=>'<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="explain" id="e'+i+'"><b>Jawaban benar:</b> '+a.map(x=>String.fromCharCode(65+x)+'. '+q.o[x]).join(', ')+'<br><b>Cara mengerjakan:</b> '+q.e+'</div></section>'}).join('')}
function ans(i){return [...document.querySelectorAll('[name="q'+i+'"]:checked')].map(x=>+x.value).sort((a,b)=>a-b)}
function same(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function calc(){let s=0;data.forEach((q,i)=>{const a=(Array.isArray(q.a)?q.a:[q.a]).slice().sort((x,y)=>x-y);if(same(ans(i),a))s++});return s}
function periksa(){lastScore=calc();checked=true;const nilai=Math.round(lastScore/data.length*100);document.getElementById('result').innerHTML='<div class="result"><h2>Nilai: '+nilai+'</h2><p>Benar <b>'+lastScore+'</b> dari '+data.length+' soal.</p></div>'}
function koreksi(){if(!checked)periksa();data.forEach((q,i)=>document.getElementById('e'+i).classList.add('show'));document.getElementById('result').innerHTML+='<div class="result">📝 Jawaban benar dan cara mengerjakan semua soal sudah ditampilkan.</div>'}
function simpan(){if(!checked)periksa();const nama=document.getElementById('nama').value.trim();if(!nama){alert('Isi nama siswa terlebih dahulu.');return}const arr=JSON.parse(localStorage.getItem(histKey)||'[]');arr.unshift({nama,title:"ASTS 1 Bab 2 — Tembang Gambuh",nilai:Math.round(lastScore/data.length*100),benar:lastScore,total:data.length,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(histKey,JSON.stringify(arr.slice(0,50)));alert('Nilai berhasil disimpan. Buka menu ASTS 1 untuk melihat riwayat nilai.')}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('.explain').forEach(x=>x.classList.remove('show'));document.getElementById('result').innerHTML='';checked=false;lastScore=0;window.scrollTo({top:0,behavior:'smooth'})}
function init(){render();document.getElementById('checkBtn').onclick=periksa;document.getElementById('reviewBtn').onclick=koreksi;document.getElementById('saveBtn').onclick=simpan;document.getElementById('resetBtn').onclick=resetQuiz}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
</script></body></html>
