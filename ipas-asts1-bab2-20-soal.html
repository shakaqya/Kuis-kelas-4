<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTS 1 Bab 2 — Gaya di Sekitar Kita</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#fff8e1);color:#263238}
.top{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;text-align:center;padding:30px 16px}
.top h1{margin:8px 0;font-size:clamp(26px,6vw,42px)}.wrap{max-width:950px;margin:auto;padding:20px 14px}
.panel,.q{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #0002}
input[type=text]{width:100%;padding:12px;border:1px solid #cfd8dc;border-radius:10px;font-size:16px}
.q h3{margin-top:0}.opt{display:block;padding:11px;border:1px solid #dce3e6;border-radius:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#f1f8e9}
.actions{display:flex;gap:9px;flex-wrap:wrap;position:sticky;bottom:8px;background:#ffffffee;padding:10px;border-radius:14px;box-shadow:0 3px 14px #0002}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.check{background:#2e7d32;color:#fff}.review{background:#1565c0;color:#fff}.save{background:#ef6c00;color:#fff}.reset{background:#6d4c41;color:#fff}
.result{padding:15px;border-radius:12px;background:#e8f5e9;margin-top:12px}.wrong{background:#ffebee}.correct{background:#e8f5e9}.explain{display:none;background:#fff8e1;border-left:4px solid #ef6c00;padding:12px;margin-top:10px;border-radius:8px}.show{display:block}
.home{display:inline-block;text-decoration:none;background:#fff;color:#2e7d32;padding:9px 14px;border-radius:9px;font-weight:800}.progress{font-weight:800;color:#546e7a}
</style></head><body>
<header class="top"><div>🌿 IPAS • KELAS 4 • ASTS 1</div><h1>ASTS 1 Bab 2 — Gaya di Sekitar Kita</h1><p>20 soal berdasarkan materi pengaruh gaya, jenis-jenis gaya, magnet, dan kompas.</p><a class="home" href="ipas-menu.html?v=20260923">🏠 Kembali ke Menu IPAS</a></header>
<main class="wrap"><section class="panel"><label><b>Nama siswa</b><input id="nama" type="text" placeholder="Tulis nama siswa"></label><p class="progress">📝 20 soal • Pilih jawaban yang paling tepat. Untuk soal bertanda <b>(PGK)</b>, boleh memilih lebih dari satu.</p><div id="result"></div></section><form id="quiz"></form>
<div class="actions"><button class="check" id="checkBtn" type="button">📊 Periksa Nilai</button><button class="review" id="reviewBtn" type="button">📝 Periksa Jawaban</button><button class="save" id="saveBtn" type="button">💾 Simpan Nilai</button><button class="reset" id="resetBtn" type="button">🔄 Ulangi</button></div></main>
<script>
const data=[{"q":"Gaya adalah …","o":["tarikan atau dorongan yang bekerja pada benda","warna suatu benda","ukuran benda","suhu benda"],"a":0,"e":"Materi mendefinisikan gaya sebagai tarikan atau dorongan yang bekerja pada benda."},{"q":"Salah satu pengaruh gaya terhadap benda adalah …","o":["mengubah gerak atau posisi benda","menghilangkan massa benda","mengubah benda menjadi energi","selalu membuat benda panas"],"a":0,"e":"Gaya dapat membuat benda bergerak, berhenti, berubah arah, atau berpindah posisi."},{"q":"Ketika seseorang mendorong meja hingga berpindah, gaya menyebabkan meja …","o":["berubah warna","berpindah posisi","menjadi magnet","menghasilkan cahaya"],"a":1,"e":"Dorongan memberikan gaya yang dapat membuat benda berpindah posisi."},{"q":"Tendangan pemain sepak bola yang membuat bola berubah arah menunjukkan bahwa gaya dapat …","o":["mengubah arah gerak benda","mengubah massa benda","menghilangkan gravitasi","mengubah benda menjadi cair"],"a":0,"e":"Gaya tendangan dapat mengubah arah gerak bola."},{"q":"Menekan plastisin hingga bentuknya berubah menunjukkan gaya dapat …","o":["mengubah bentuk benda","mengubah warna benda","menghilangkan gaya gravitasi","membuat benda tidak bermassa"],"a":0,"e":"Tekanan merupakan gaya yang dapat menyebabkan bentuk benda berubah."},{"q":"Benda di dalam air dapat tenggelam jika …","o":["gaya berat lebih besar daripada gaya angkat air","gaya angkat air lebih besar daripada gaya berat","tidak ada gaya","air tidak memberikan gaya"],"a":0,"e":"Materi menjelaskan benda tenggelam ketika gaya berat lebih besar daripada gaya angkat air."},{"q":"Benda melayang di dalam air jika …","o":["gaya berat sama dengan gaya angkat air","gaya berat selalu lebih besar","tidak ada gravitasi","benda tidak memiliki massa"],"a":0,"e":"Keadaan melayang terjadi ketika gaya angkat air sama dengan gaya berat benda."},{"q":"Benda terapung jika …","o":["gaya angkat air lebih besar daripada gaya berat","gaya berat lebih besar","tidak ada gaya angkat","benda selalu berada di dasar"],"a":0,"e":"Benda terapung ketika gaya angkat air lebih besar daripada gaya beratnya."},{"q":"Gaya yang terjadi karena kerja otot manusia disebut …","o":["gaya otot","gaya magnet","gaya gravitasi","gaya listrik statis"],"a":0,"e":"Mengayuh sepeda, mendorong, dan menarik merupakan contoh penggunaan gaya otot."},{"q":"Gaya gesek muncul karena …","o":["dua permukaan benda saling bersentuhan","benda terkena cahaya","benda berada jauh dari bumi","benda tidak bergerak sama sekali"],"a":0,"e":"Gaya gesek muncul akibat kontak atau persentuhan dua permukaan benda."},{"q":"Permukaan yang lebih kasar umumnya menghasilkan gaya gesek yang …","o":["lebih besar","lebih kecil","selalu nol","tidak ada"],"a":0,"e":"Materi menjelaskan permukaan kasar memperbesar gaya gesek, sedangkan permukaan licin memperkecilnya."},{"q":"Contoh pemanfaatan gaya gesek yang menguntungkan adalah …","o":["rem sepeda membantu menghentikan sepeda","membuat benda selalu sulit bergerak","menghambat semua mesin","membuat benda melayang"],"a":0,"e":"Rem memanfaatkan gaya gesek antara bagian rem dan roda untuk memperlambat atau menghentikan sepeda."},{"q":"Gaya pegas dimanfaatkan pada …","o":["ketapel","kompas","lampu minyak","panel surya"],"a":0,"e":"Ketapel menggunakan karet yang dapat meregang dan kembali sehingga memberikan gaya pegas."},{"q":"Gaya listrik statis dapat terjadi setelah penggaris plastik …","o":["digosok lalu dapat menarik potongan kertas","direndam air","didinginkan","diletakkan di tanah"],"a":0,"e":"Penggaris plastik yang digosok dapat bermuatan listrik statis dan menarik benda ringan seperti potongan kertas."},{"q":"Benda yang dapat ditarik kuat oleh magnet termasuk benda …","o":["feromagnetik","diamagnetik","selalu plastik","tidak bermassa"],"a":0,"e":"Materi membagi bahan magnetik berdasarkan kekuatannya; benda feromagnetik dapat ditarik magnet dengan kuat."},{"q":"Contoh benda yang dapat ditarik magnet adalah … (PGK)","o":["paku","klip kertas","baja","kertas biasa"],"a":[0,1,2],"e":"Paku, klip kertas, dan baja termasuk bahan yang dapat tertarik magnet; kertas biasa bukan benda magnetik."},{"q":"Jika dua kutub magnet yang sama didekatkan, keduanya akan …","o":["tolak-menolak","tarik-menarik","melebur","tidak terpengaruh"],"a":0,"e":"Kutub magnet yang sama saling tolak-menolak, sedangkan kutub yang berbeda saling tarik-menarik."},{"q":"Magnet dapat digunakan pada pintu lemari agar pintu …","o":["menutup rapat","menghasilkan listrik","menjadi berat","berubah menjadi kayu"],"a":0,"e":"Magnet dapat digunakan untuk merapatkan atau menahan pintu lemari tetap tertutup."},{"q":"Kompas dapat menunjukkan arah utara dan selatan karena …","o":["jarum kompas berupa magnet yang dipengaruhi medan magnet bumi","kompas tertarik matahari","kompas bekerja karena gaya gesek","jarum kompas terbuat dari kayu"],"a":0,"e":"Jarum kompas merupakan magnet yang berinteraksi dengan medan magnet bumi sehingga menunjukkan arah utara-selatan."},{"q":"Manakah pasangan gaya yang termasuk gaya tidak sentuh? (PGK)","o":["gaya magnet","gaya gravitasi","gaya listrik statis","gaya otot"],"a":[0,1,2],"e":"Gaya magnet, gravitasi, dan listrik statis dapat bekerja tanpa kontak langsung. Gaya otot termasuk gaya sentuh."}];
const histKey='nilai-asts1-ipas-kelas4';
let checked=false,lastScore=null;
function render(){document.getElementById('quiz').innerHTML=data.map((q,i)=>{
 const multi=Array.isArray(q.a);
 return '<section class="q" id="q'+i+'"><h3>'+ (i+1)+'. '+q.q+'</h3>'+
 q.o.map((o,j)=>'<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+
 '<div class="explain" id="e'+i+'"><b>Jawaban benar:</b> '+q.a.map?(()=>{const a=Array.isArray(q.a)?q.a:[q.a];return a.map(x=>String.fromCharCode(65+x)+'. '+q.o[x]).join(', ')})():String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'<br><b>Cara mengerjakan:</b> '+q.e+'</div></section>';
}).join('')}
function getAns(i){return [...document.querySelectorAll('[name="q'+i+'"]:checked')].map(x=>+x.value).sort((a,b)=>a-b)}
function same(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function calc(){let score=0;data.forEach((q,i)=>{let u=getAns(i),a=(Array.isArray(q.a)?q.a:[q.a]).slice().sort((x,y)=>x-y);if(same(u,a))score++});return score}
function periksa(){const s=calc();lastScore=s;checked=true;document.getElementById('result').innerHTML='<div class="result"><h2>Nilai: '+Math.round(s/data.length*100)+'</h2><p>Benar <b>'+s+'</b> dari '+data.length+' soal.</p></div>';data.forEach((q,i)=>{document.getElementById('q'+i).classList.toggle('correct',same(getAns(i),(Array.isArray(q.a)?q.a:[q.a]).slice().sort((a,b)=>a-b)));});}
function koreksi(){data.forEach((q,i)=>document.getElementById('e'+i).classList.add('show'));if(!checked)periksa();document.getElementById('result').innerHTML+='<div class="result">📝 Pembahasan setiap soal sudah ditampilkan.</div>'}
function simpan(){if(!checked)periksa();const nama=document.getElementById('nama').value.trim();if(!nama){alert('Isi nama siswa terlebih dahulu.');return}const arr=JSON.parse(localStorage.getItem(histKey)||'[]');arr.unshift({nama,title:"ASTS 1 Bab 2 — Gaya di Sekitar Kita",nilai:Math.round(lastScore/data.length*100),benar:lastScore,total:data.length,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(histKey,JSON.stringify(arr.slice(0,30)));alert('Nilai berhasil disimpan.');}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('.explain').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.q').forEach(x=>x.classList.remove('correct','wrong'));document.getElementById('result').innerHTML='';checked=false;lastScore=null;window.scrollTo({top:0,behavior:'smooth'})}
function init(){render();document.getElementById('checkBtn').onclick=periksa;document.getElementById('reviewBtn').onclick=koreksi;document.getElementById('saveBtn').onclick=simpan;document.getElementById('resetBtn').onclick=resetQuiz}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
</script></body></html>
