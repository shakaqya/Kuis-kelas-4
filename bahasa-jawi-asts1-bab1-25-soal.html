<script>
const data=[{"q":"Geguritan kalebu salah sawijining jinis sastra Jawa kang nggunakake basa ...","o":["Indonesia","Jawa","Arab","Inggris"],"a":1,"e":"Ing kaca ringkesan Pasinaon 1, geguritan diterangake minangka salah sawijining jinis sastra Jawa sing nggunakake basa Jawa."},{"q":"Ukara ing geguritan biasane nggunakake basa ...","o":["krama wae","ngoko lan krama","Indonesia wae","Madura"],"a":1,"e":"Materi nerangake geguritan bisa nggunakake basa Jawa, kalebu ragam ngoko lan krama."},{"q":"Geguritan \"Aja Jothakan\" nduweni tema utama babagan ...","o":["kerukunan lan becik tumrap sesrawungan","olahraga","pasar","perjalanan"],"a":0,"e":"Isi geguritan Aja Jothakan ngajari supaya ora jothakan, ora seneng padu, lan urip rukun kaya sedulur."},{"q":"Salah siji piwulang saka geguritan \"Aja Jothakan\" yaiku ...","o":["seneng padu","urip rukun kaya sedulur","seneng nyalahake wong liya","ora perlu nulungi kanca"],"a":1,"e":"Ing pungkasan geguritan ana piwulang supaya guyub rukun kaya sedulur."},{"q":"Tembung \"sawetara\" ing tabel negasi tembung geguritan tegese ...","o":["sementara waktu","bertengkar","berbicara","berikutnya"],"a":0,"e":"Tabel tembung ing kaca 4 menehi padanan basa Indonesia \"sementara waktu\" kanggo \"sawetara\"."},{"q":"Tembung \"jothakan\" tegese ...","o":["bertengkar atau saling mendiamkan","berkomunikasi","berjalan","menunggu"],"a":0,"e":"Ing tabel, \"jothakan\" dipadakake karo \"bertengkar\"; ing konteks geguritan uga nggambarake kahanan ora rukun."},{"q":"Tembung \"uga\" ing geguritan nduweni teges ...","o":["dan","atau","tetapi","karena"],"a":0,"e":"Ing tabel padanan tembung, \"uga\" tegese \"dan\"."},{"q":"Tembung \"gelem\" tegese ...","o":["mau","tidak","berbicara","berikutnya"],"a":0,"e":"Tabel negasi tembung nuduhake \"gelem\" = \"mau\"."},{"q":"Tembung \"banjur\" tegese ...","o":["kemudian","berhenti","sedih","marah"],"a":0,"e":"Ing kamus cilik kaca 6, \"banjur\" diterjemahake dadi \"kemudian; lalu\"."},{"q":"Tembung \"wong\" tegese ...","o":["orang","anak","rumah","guru"],"a":0,"e":"\"Wong\" iku tembung Jawa kanggo \"orang\"."},{"q":"Ing geguritan, maca kanthi lafal, lagu, lan intonasi sing bener kalebu latihan ...","o":["maca endah","nulis","nggambar","itung"],"a":0,"e":"Wulangan 3 kanthi irah-irahan \"Maca Geguritan\" nglatih maca endah kanthi lafal, lagu, lan intonasi."},{"q":"Nalika maca geguritan, ekspresi sing trep kudu ...","o":["ngguyu terus","cocog karo isi lan swasana geguritan","ora perlu","padha wae ing kabeh geguritan"],"a":1,"e":"Materi menehi perhatian marang lafal, lagu, intonasi, lan ekspresi supaya maca geguritan trep karo isine."},{"q":"Pernyataan sing paling cocog karo cara maca geguritan yaiku ...","o":["maca tanpa intonasi","maca kanthi runtut lan ekspresif","mung maca judhul","ngganti kabeh tembung"],"a":1,"e":"Ing latihan maca endah, siswa diwenehi arahan maca kanthi lafal, lagu, intonasi, lan ekspresi sing trep."},{"q":"Ing wulangan 2, siswa dilatih nulis ... ing geguritan.","o":["pitutur luhur","jadwal piket","resep masakan","alamat omah"],"a":0,"e":"Wulangan 2 nduweni kegiatan \"Nulis Pitutur Luhur Kang Ana ing Geguritan\"."},{"q":"Pitutur luhur yaiku ...","o":["nasihat atau ajaran baik","judul buku","nama tokoh","pola irama"],"a":0,"e":"Pitutur luhur ing materi digunakake kanggo nggambarake nasihat utawa ajaran becik saka geguritan."},{"q":"Ing geguritan \"Aja Jothakan\", tumindak sing ora becik yaiku ...","o":["guyub rukun","seneng padu","nulungi kanca","ngurmati sedulur"],"a":1,"e":"Isi geguritan ngelingake supaya ora jothakan lan ora seneng padu."},{"q":"Kegiatan nulis pokok-pokok isine geguritan nduweni tujuan supaya siswa bisa ...","o":["ngganti judhul","mangerteni inti isi geguritan","ngilangi kabeh tembung","nggawe gambar wae"],"a":1,"e":"Pokok-pokok isi mbantu siswa ngringkes lan mangerteni inti geguritan."},{"q":"Ing Pasinaon 1, geguritan diwaca banjur siswa menehi komentar marang ...","o":["kanca sing maca geguritan","guru olahraga","penjaga sekolah","pedagang"],"a":0,"e":"Kegiatan kaca 6 nerangake sawise siswa maca geguritan, banjur siswa liyane bisa menehi komentar babagan endahing maca."},{"q":"Tembung \"pasinaon\" ing konteks buku iki tegesé ...","o":["pembelajaran","permainan","perjalanan","perdagangan"],"a":0,"e":"\"Pasinaon\" digunakake minangka istilah kanggo unit utawa pembelajaran ing buku."},{"q":"Ing soal HOTS Pasinaon 1, geguritan \"Pangarep-Arep\" nyebutake bab ...","o":["panen lan tanduran","bal-balan","sekolah anyar","pasar wengi"],"a":0,"e":"Geguritan Pangarep-Arep ing kaca 10 nyebut tanduran pari lan wektu panen."},{"q":"Miturut geguritan \"Pangarep-Arep\", apa sing dadi pangarep-arep sing digambarake?","o":["panen sing becik","padu karo kanca","ora sekolah","adol dolanan"],"a":0,"e":"Isi geguritan nggambarake pangarep-arep marang tanduran pari lan wektu panen."},{"q":"Ing AKM Pasinaon 1, tembung \"milara\" ing geguritan kudu dipahami adhedhasar ...","o":["konteks ukara","warna buku","jumlah gambar","jeneng penulis"],"a":0,"e":"Pitakon AKM njaluk siswa milih tembung sing paling trep adhedhasar konteks geguritan."},{"q":"Ing latihan tanda ping (x), tandha kasebut digunakake kanggo ...","o":["menehi pratandha ing aksara utawa bagean sing dadi wangsulan","nggambar pemandangan","ngitung suku kata","ngganti basa"],"a":0,"e":"Kaca 7-8 menehi latihan menehi tandha ping (x) ing aksara sangarepe wangsulan sing trep."},{"q":"Salah siji tujuan pembelajaran Pasinaon 1 yaiku siswa bisa ...","o":["maca geguritan kanthi lafal lan intonasi sing bener","nggawe mesin","ngitung pecahan","nggambar peta"],"a":0,"e":"Tujuan pembelajaran kaca 1 kalebu maca geguritan kanthi lafal lan intonasi sing bener."},{"q":"Ing kaca pungkasan Pasinaon 1, kegiatan \"Ngedhith Geguritan\" njaluk siswa ...","o":["maca kanthi pasangan lan nulis ukara ing kertas HVS","nyanyi Tembang Gambuh","nggawe peta","ngitung dhuwit"],"a":0,"e":"Kegiatan kasebut menehi arahan maca geguritan bebarengan karo kanca/pasangan lan nindakake tugas nulis."}];const histKey='nilai-asts1-bahasa-jawi-kelas4';let checked=false,lastScore=0;
function render(){document.getElementById('quiz').innerHTML=data.map((q,i)=>{const a=Array.isArray(q.a)?q.a:[q.a];const multi=a.length>1;return '<section class="q" id="q'+i+'"><div class="tag">'+(multi?'PGK — pilih semua yang benar':'Pilihan Ganda')+'</div><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map((o,j)=>'<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="explain" id="e'+i+'"><b>Jawaban benar:</b> '+a.map(x=>String.fromCharCode(65+x)+'. '+q.o[x]).join(', ')+'<br><b>Cara mengerjakan:</b> '+q.e+'</div></section>'}).join('')}
function ans(i){return [...document.querySelectorAll('[name="q'+i+'"]:checked')].map(x=>+x.value).sort((a,b)=>a-b)}
function same(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function calc(){let s=0;data.forEach((q,i)=>{const a=(Array.isArray(q.a)?q.a:[q.a]).slice().sort((x,y)=>x-y);if(same(ans(i),a))s++});return s}
function periksa(){lastScore=calc();checked=true;const nilai=Math.round(lastScore/data.length*100);document.getElementById('result').innerHTML='<div class="result"><h2>Nilai: '+nilai+'</h2><p>Benar <b>'+lastScore+'</b> dari '+data.length+' soal.</p></div>'}
function koreksi(){if(!checked)periksa();data.forEach((q,i)=>document.getElementById('e'+i).classList.add('show'));document.getElementById('result').innerHTML+='<div class="result">📝 Jawaban benar dan cara mengerjakan semua soal sudah ditampilkan.</div>'}
function simpan(){if(!checked)periksa();const nama=document.getElementById('nama').value.trim();if(!nama){alert('Isi nama siswa terlebih dahulu.');return}const arr=JSON.parse(localStorage.getItem(histKey)||'[]');arr.unshift({nama,title:"ASTS 1 Bab 1 — Geguritan",nilai:Math.round(lastScore/data.length*100),benar:lastScore,total:data.length,waktu:new Date().toLocaleString('id-ID')});localStorage.setItem(histKey,JSON.stringify(arr.slice(0,50)));alert('Nilai berhasil disimpan. Buka menu ASTS 1 untuk melihat riwayat nilai.')}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('.explain').forEach(x=>x.classList.remove('show'));document.getElementById('result').innerHTML='';checked=false;lastScore=0;window.scrollTo({top:0,behavior:'smooth'})}
function init(){render();document.getElementById('checkBtn').onclick=periksa;document.getElementById('reviewBtn').onclick=koreksi;document.getElementById('saveBtn').onclick=simpan;document.getElementById('resetBtn').onclick=resetQuiz}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
</script></body></html>
