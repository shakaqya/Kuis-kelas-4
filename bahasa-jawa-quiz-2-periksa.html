<!doctype html><html lang="jv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahasa Jawa Kelas 2 — Quiz 2</title><style>body{margin:0;font-family:system-ui,Arial;background:#f3e5f5}.top{background:linear-gradient(135deg,#6a1b9a,#1565c0);color:#fff;text-align:center;padding:25px}.top a{display:inline-block;background:#fff;color:#6a1b9a;padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:800}.wrap{max-width:950px;margin:auto;padding:15px}.info{background:#fff;border-radius:16px;padding:15px;text-align:center;box-shadow:0 4px 15px #0002;margin-bottom:15px}.frame{width:100%;height:82vh;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 15px #0002}</style></head><body><header class="top"><h1>🎯 Quiz 2 — Bahasa Jawa</h1><p>Soal berbeda dengan Quiz 1. Jawaban benar akan ditampilkan setelah pemeriksaan.</p><a href="bahasa-jawa-menu.html">↩️ Menu Bahasa Jawa</a></header><main class="wrap"><div class="info">💡 Yen jawaban salah utawa durung dijawab, sistem bakal nuduhake <b>jawaban sing benar</b>.</div><iframe id="quizFrame" class="frame" src="bahasa-jawa-quiz-2.html"></iframe></main><script>const fr=document.getElementById('quizFrame');fr.addEventListener('load',()=>{try{const w=fr.contentWindow,d=fr.contentDocument;if(!w.qs)return;const old=w.check;w.check=function(){old();w.qs.forEach((q,i)=>{const fb=d.getElementById('fb'+i);let a=d.querySelector('[name="q'+i+'"]:checked');if(!a){fb.innerHTML='<span style="color:#c62828;font-weight:800">⚠️ Durung dijawab. Jawaban benar: <b>'+q[1][q[2]]+'</b></span>'}else if(+a.value!==q[2]){fb.innerHTML='<span style="color:#c62828;font-weight:800">✗ Salah. Jawaban benar: <b>'+q[1][q[2]]+'</b></span>'}else{fb.innerHTML='<span style="color:#2e7d32;font-weight:800">✓ Bener!</span>'}})}}catch(e){console.log(e)}});</script></body></html>
