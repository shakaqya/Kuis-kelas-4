isting=source[i]?.innerHTML||'';const opts=labels.map(l=>{const inp=l.querySelector('input[type="radio"]'),txt=l.innerText.trim(),selected=chosen&&inp===chosen;return '<div class="er-opt '+(selected?'selected':'')+'">'+esc(txt)+(selected?' <b>← jawabanmu</b>':'')+'</div>'}).join('');cards.push('<div class="er-card"><div class="er-question">📝 '+esc(title)+'</div><div class="er-options">'+opts+'</div><div class="er-method"><b>📌 Cara mengerjakan</b><ol><li>Baca soal dengan teliti dan tentukan apa yang ditanyakan.</li><li>Perhatikan pilihan jawaban dan hubungkan dengan materi.</li><li>Bandingkan pilihan satu per satu, lalu pilih yang paling sesuai.</li></ol><div class="er-flow"><span class="er-step">📖 Baca</span><span class="er-arrow">→</span><span class="er-step">🧠 Pahami</span><span class="er-arrow">→</span><span class="er-step">🔎 Bandingkan</span><span class="er-arrow">→</span><span class="er-step">✅ Pilih</span></div></div>'+(existing?'<div class="er-existing"><b>🔍 Hasil koreksi:</b><br>'+existing+'</div>':'')+'</div>')});const wrap=document.createElement('section');wrap.id='enhancedReview';wrap.className='enhanced-review';wrap.innerHTML='<h2>📚 Soal & Cara Mengerjakan</h2><p>Soal ditampilkan kembali bersama jawabanmu dan hasil koreksi.</p>'+cards.join('');const target=document.querySelector('#review,#result,.result:last-of-type')||document.querySelector('form')||document.body;target.insertAdjacentElement('afterend',wrap);wrap.scrollIntoView({behavior:'smooth',block:'start'})}function hook(){document.querySelectorAll('button,input[type="button"],input[type="submit"]').forEach(b=>{if(b.dataset.erHook)return;if(/periksa|lihat nilai|lihat hasil|check quiz|check answer/i.test(b.innerText||b.value||'')){b.dataset.erHook='1';b.addEventListener('click',()=>setTimeout(build,120))}})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook()})();</script></body></html>
